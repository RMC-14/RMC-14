- type: constructionGraph
  parent: RMC
  id: RMCCatwalkGraph
  start: start
  graph:
  - node: start
    edges:
    - to: catwalkFinished
      completed:
      - !type:SnapToGrid
        southRotation: true
      steps:
      - material: CMRodMetal
        amount: 2

  - node: catwalkFinished
    entity: CMCatwalk
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: CMRodMetal
        amount: 2
      - !type:DeleteEntity
      steps:
      - tool: Cutting
        doAfter: 2
        duplicateConditions: All
