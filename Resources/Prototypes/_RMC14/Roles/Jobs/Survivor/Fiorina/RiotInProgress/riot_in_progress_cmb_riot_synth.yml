      prefix: cm-job-prefix-survivor-fiorina-cmb-riot-control-synth
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: synth
      background:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: background_cmb

- type: startingGear
  id: RMCGearSurvivorFiorinaRiotInProgressCMBRiotControlSynth
