- type: job
  parent: CMSurvivor
  id: RMCSurvivorNewVaraderoChaplain
  name: cm-job-name-survivor-varadero-chaplain
  description: cm-job-description-survivor
  playTimeTracker: CMJobSurvivor
  startingGear: RMCGearSurvivorVaraderoChaplain
  ranks:
    RMCRankCorporal: []
  spawnMenuRoleName: UNMC Base Chaplain (NV Survivor)
  special:
  - !type:AddComponentSpecial
    components:
    - type: AssignSquad
      whitelist:
        tags:
        - RMCSquadNVUNMC
    - type: Skills
      preset: RMCSkillPresetSurvivorChaplain
    - type: EquipSurvivorPreset
      preset: RMCGearSurvivorPresetVaraderoChaplain
    - type: MarineOrders
    - type: RMCSurvivor
    - type: MotionDetectorTracked
    - type: NpcFactionMember
      factions:
      - UNMC
      - Civilian
    - type: IntelRescueSurvivorObjective
    - type: JobPrefix
      prefix: rmc-job-prefix-survivor-varadero-chaplain
    - type: RMCAllowSuitStorage
    - type: Language
      spokenLanguages:
      - Spanish
      - English
      understoodLanguages:
      - Spanish
      - English
      currentLanguage: English
      defaultLanguage: English
  useLoadoutOfJob: CMSurvivor # for inheritance

- type: startingGear
  parent: RMCGearSurvivorEquipped
  id: RMCGearSurvivorVaraderoChaplain
  equipment:
    id: CMIDCardStandardDogtag
    jumpsuit: RMCJumpsuitCivilianGreen
    outerClothing: RMCClothingPriestRobes
    back: CMSatchel
    shoes: RMCShoesLaceup
    pocket2: RMCPouchGeneralLarge
  storage:
    back:
    - RMCBible
    - CMSheetMetal20

- type: entity
  parent: CMSpawnPointJobBase
  id: RMCSpawnPointSurvivorVaraderoChaplain
  name: survivor priest spawn point
  components:
  - type: SpawnPoint
    job_id: CMSurvivorPriest
  - type: Sprite
    layers:
    - sprite: _RMC14/Markers/landmarks.rsi
      state: surv

- type: entity
  parent: [RMCSurvivorPresetCivilianRareItem, RMCGearSurvivorPresetUNMC]
  id: RMCGearSurvivorPresetVaraderoChaplain
  name: priest colonist preset
  categories: [ HideSpawnMenu ]
