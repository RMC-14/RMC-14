- type: job
  parent: CMSurvivorEngineer
  id: RMCSurvivorUNMCGroundCrewman
  name: rmc-job-name-survivor-ground-crew
  description: cm-job-description-survivor
  playTimeTracker: CMJobSurvivorEngineer
  greeting: rmc-job-greeting-varadero
  startingGear: RMCGearSurvivorUNMCGroundCrewman
  ranks:
    RMCRankCorporal:
    - !type:RoleTimeRequirement
      role: CMJobSurvivorEngineer
      time: 252000 # 70 hours
    RMCRankLanceCorporal: []
  spawnMenuRoleName: UNMC Ground Crew (NV Survivor)
  icon: "CMJobIconCombatTech"
  hasIcon: true
  special:
  - !type:AddComponentSpecial
    components:
    - type: AssignSquad
      whitelist:
        tags:
        - RMCSquadMarineVaradero
    - type: Skills
      preset: RMCSkillPresetSurvivorUNMCGroundCrew
    - type: RMCSurvivor
    - type: MotionDetectorTracked
    - type: NpcFactionMember
      factions:
      - UNMC
      - Civilian
    - type: IntelRescueSurvivorObjective
    - type: RMCAllowSuitStorage
    - type: EquipSurvivorPreset
      preset: RMCSurvivorPresetUNMCGroundCrewman
    - type: JobPrefix
      prefix: rmc-job-prefix-survivor-ground-crew
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: engi
      background:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: background_unmc
    - type: Language
      spokenLanguages:
        - Spanish
        - English
      understoodLanguages:
        - Spanish
        - English
      currentLanguage: English
      defaultLanguage: English
  useLoadoutOfJob: CMSurvivorEngineer # for inheritance
  medals:
    Bronze: RMCMedalBronzeService
    Silver: RMCMedalSilverService
    Gold: RMCMedalGoldService
    Platinum: RMCMedalPlatinumService
    Ruby: RMCMedalRubyService
    Amethyst: RMCMedalAmethystService
    Emerald: RMCMedalEmeraldService
    Prismatic: RMCMedalPrismaticService

- type: startingGear
  id: RMCGearSurvivorUNMCGroundCrewman
  equipment:
    ears: RMCHeadsetMarineNV
    gloves: CMHandsInsulated
    id: CMIDCardStandardDogtag
    pocket1: RMCPouchSurvivalFill
    back: RMCSatchelNV
    shoes: CMBootsUrbanFilled
    outerClothing: RMCArmorPDU
  storage:
    back:
      - CMSheetMetal20

- type: entity
  parent: RMCGearSurvivorPresetUNMC
  id: RMCSurvivorPresetUNMCGroundCrewman
  name: varadero ground crew preset
  categories: [ HideSpawnMenu ]
  components:
    - type: EntityPreset
      randomOutfits:
        - [ RMCHeadCapPatrolNV, RMCWeldingGoggles, RMCJumpsuitMarineNVEngi ]
        - [ RMCArmorHelmetCF5Utility, RMCWeldingGoggles, RMCPouchToolsFill, RMCJumpsuitMarineNVEngi ]
        - [ ClothingHeadHatWelding, RMCJumpsuitMarineNVUtility, RMCPouchToolsFill ]
        - [ CMBeltUtilityFilled, RMCArmorHelmetCF5Utility, RMCJumpsuitMarineNVEngi ]
        - [ CMBeltUtilityFilled, RMCArmorHelmetCF5UtilityRed, RMCJumpsuitMarineNVEngi ]
        - [ RMCHeadCapPatrolNV, CMBeltUtilityFilled, RMCJumpsuitMarineNVUtility, RMCWeldingGoggles ]
        - [ RMCHardhatOrange, CMBeltUtilityFilled, WeaponNailgun, RMCJumpsuitMarineNVEngi, RMCWeldingGoggles ]
