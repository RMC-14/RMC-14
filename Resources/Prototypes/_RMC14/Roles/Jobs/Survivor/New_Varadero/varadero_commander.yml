    id: CMIDCardGold
    pocket1: RMCPouchSurvivalFill
    pocket2: RMCPouchGeneralLarge
  storage:
    pocket2:
    - CMClipboard
    - CMPenFountain
    back:
    - CMSheetMetal20

- type: entity
  parent: CMSpawnPointJobBase
  id: CMSpawnPointSurvivorCommanderNewVardero
  name: new varadero commanding officer spawn point
  components:
  - type: SpawnPoint
    job_id: RMCSurvivorCommanderNewVaradero
  - type: Sprite
    state: co_spawn

- type: jobIcon
  parent: CMJobIconBase
  id: RMCJobIconSurvivorCommanderNewVaradero
  icon:
    sprite: _RMC14/Interface/job_icons/UNMC/other.rsi
    state: hudsquad_nv_co
