- type: job
  parent: RMCSurvivorTyrargoBase
  id: RMCSurvivorTyrargoCET
  name: rmc-job-name-tyrargo-cet
  startingGear: RMCGearTyrargoCET
  icon: "RMCJobIconTyrargoCET"
  requirements:
  - !type:RoleTimeRequirement
    role: CMJobCombatTech
    time: 36000 # 10 hours
  - !type:TotalJobsTimeRequirement
    group: RMCJobsSurvivor
    time: 5400 # 1.5 hours
  spawnMenuRoleName: UNMC Combat Engineering Technician (Tyrargo Rift Survivor)
  ranks:
    RMCRankLanceCorporal: []
  special:
  - !type:AddComponentSpecial
    components:
    - type: Skills
      preset: RMCSkillPresetEngineeringTechnician
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: medic
    - type: IntelRescueSurvivorObjective
    - type: AssignSquad
      whitelist:
        tags:
        - RMCSquadUNMC
    - type: EquipSurvivorPreset
      preset: RMCSurvivorPresetTyrargoCET
    - type: JobPrefix
      prefix: rmc-job-prefix-tyrargo-cet
  hidden: true

- type: startingGear
  parent: RMCGearTyrargoBase
  id: RMCGearTyrargoCET
  equipment:
    head: RMCArmorHelmetTyrargoEngineer
    eyes: RMCGogglesBallisticPolarizedBlue
    back: RMCBackpackTyrargoSurvivorFillCET
    belt: CMBeltUtilityFilled
    gloves: CMHandsInsulated

- type: entity
  parent: CMSpawnPointJobBase
  id: CMSpawnPointTyrargoCET
  name: marine combat engineering technician spawn point
  components:
  - type: SpawnPoint
    job_id: RMCSurvivorTyrargoCET
  - type: Sprite
    state: spec_spawn

- type: entity
  parent: RMCSurvivorPresetTyrargoSurvivorNoPistol
  id: RMCSurvivorPresetTyrargoCET
  name: tyrargo marine combat engineering technician survivor preset
  categories: [ HideSpawnMenu ]
  components:
  - type: EntityPreset
    randomOutfits:
    - []

- type: jobIcon
  parent: CMJobIconBase
  id: RMCJobIconTyrargoCET
  icon:
    sprite: _RMC14/Interface/job_icons/UNMC/tyrargo.rsi
    state: hudsquad_cet
