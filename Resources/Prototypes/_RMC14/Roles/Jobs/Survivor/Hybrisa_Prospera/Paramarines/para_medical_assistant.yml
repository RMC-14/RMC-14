- type: job
  parent: RMCSurvivorParaBase
  id: RMCSurvivorParaMedicalAssistant
  name: rmc-job-name-para-medic
  ranks:
    RMCRankTSELanceCorporal: [ ]
  startingGear: RMCGearParaMedicalAssistant
  icon: RMCJobIconParaMedicalAssistant
  playTimeTracker: RMCJobSurvivorMilitary
  spawnMenuRoleName: RCM Paramarine Medical Assistant (Hybrisa Special Survivor)
  special:
    - !type:AddComponentSpecial
      components:
      - type: Language
        spokenLanguages:
        - Japanese
        - English
        understoodLanguages:
        - Japanese
        - English
        currentLanguage: English
        defaultLanguage: English
      - type: NpcFactionMember
        factions:
          - RoyalMarines
          - TSE
      - type: RMCSurvivor
      - type: RMCAllowSuitStorage
      - type: IntelRescueSurvivorObjective
      - type: MotionDetectorTracked
      - type: Skills
        preset: RMCSkillPresetParaMedic
      - type: TacticalMapIcon
        icon:
          sprite: /Textures/_RMC14/Interface/map_blips.rsi
          state: rmc_medic
        background:
          sprite: /Textures/_RMC14/Interface/map_blips.rsi
          state: background_para
      - type: AssignSquad
        squad: SquadPara
      - type: JobPrefix
        prefix: rmc-job-prefix-paramarine
  hidden: true

- type: startingGear
  parent: RMCGearParaBase
  id: RMCGearParaMedicalAssistant
  equipment:
    id: RMCIDRoyalParamarinesMedicalAssistant
    jumpsuit: RMCJumpsuitMarineParaPDW90
    back: RMCBackpackRCMMedicPVPFilledParaMedic
    eyes: RMCGlassesMedicalHUDGlasses
    belt: RMCMedicalL75RCMFillPara
    outerClothing: RMCArmorParaVest
    suitstorage: RMCWeaponSMGPDW90TSE

- type: entity
  parent: CMSpawnPointJobBase
  id: RMCSpawnPointParaMedicalAssistant
  name: paramarine combat medical assistant spawn point
  components:
  - type: SpawnPoint
    job_id: RMCSurvivorParaMedicalAssistant
  - type: Sprite
    state: surv_tse

- type: jobIcon
  parent: CMJobIconBase
  id: RMCJobIconParaMedicalAssistant
  icon:
    sprite: _RMC14/Interface/job_icons/TSE/RCM/paramarine.rsi
    state: para_medic
