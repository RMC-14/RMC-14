- type: job
  parent: RMCSurvivorSPPSpetsnazBase
  id: RMCSurvivorSPPSpetsnazSapper
  name: rmc-job-name-spetsnaz-sapper
  startingGear: RMCGearSPPSpetsnazSapper
  ranks:
    RMCRankSPPSerzhant: []
  icon: "RMCJobIconSPPSpetsnazSapper"
  spawnMenuRoleName: SPP Spetsnaz B/SRU Sapper (Sorokyne Special Survivor)
  special:
  - !type:AddComponentSpecial
    components:
    - type: Language
      spokenLanguages:
      - Russian
      - English
      - German
      - Chinese
      understoodLanguages:
      - Russian
      - English
      - German
      - Chinese
      currentLanguage: Russian
      defaultLanguage: Russian
    - type: RMCAllowSuitStorage
    - type: RMCSurvivor
    - type: NpcFactionMember
      factions:
      - SPP
    - type: Skills
      preset: RMCSkillPresetSurvivorSPPSapper
    - type: IntelRescueSurvivorObjective # TODO RMC14 assign squad
    - type: JobPrefix
      prefix: rmc-job-prefix-soro-spetsnaz-sapper
    - type: AssignSquad
      squad: SquadSPP
  hidden: true

- type: startingGear
  parent: RMCGearSPPSpetsnazBase
  id: RMCGearSPPSpetsnazSapper
  equipment:
    back: RMCSatchelLightpackWelderBlack
    eyes: RMCWeldingGoggles
    gloves: CMHandsInsulated
    pocket2: RMCPouchToolsSocFilledSOF
  storage:
    back:
    - CMSheetMetal40

- type: entity
  parent: CMSpawnPointJobBase
  id: RMCSpawnPointSPPSpetsnazSapper
  name: special survivor spp spetsnaz sapper spawn point
  suffix: Sorokyne
  components:
  - type: SpawnPoint
    job_id: RMCSurvivorSPPSpetsnazSapper
  - type: Sprite
    state: surv_spp

- type: jobIcon
  parent: CMJobIconBase
  id: RMCJobIconSPPSpetsnazSapper
  icon:
    sprite: _RMC14/Interface/job_icons/SPP/spetsnaz.rsi
    state: spp_sptz_sapper
