- type: job
  parent: RMCSurvivorSPPSpetsnazBase
  id: RMCSurvivorSPPSpetsnazMedic
  name: rmc-job-name-spetsnaz-medic
  startingGear: RMCGearSPPSpetsnazMedic
  ranks:
    RMCRankSPPSerzhant: []
  icon: "RMCJobIconSPPSpetsnazMedic"
  spawnMenuRoleName: SPP Spetsnaz B/SRU Medic (Sorokyne Special Survivor)
  special:
  - !type:AddComponentSpecial
    components:
    - type: Language
      spokenLanguages:
      - Russian
      - English
      - German
      - Chinese
      understoodLanguages:
      - Russian
      - English
      - German
      - Chinese
      currentLanguage: Russian
      defaultLanguage: Russian
    - type: RMCAllowSuitStorage
    - type: RMCSurvivor
    - type: NpcFactionMember
      factions:
      - SPP
    - type: Skills
      preset: RMCSkillPresetSurvivorSPPMedic
    - type: IntelRescueSurvivorObjective # TODO RMC14 assign squad
    - type: JobPrefix
      prefix: rmc-job-prefix-soro-spetsnaz-medic
    - type: AssignSquad
      squad: SquadSPP
  hidden: true

- type: startingGear
  parent: RMCGearSPPSpetsnazBase
  id: RMCGearSPPSpetsnazMedic
  equipment:
    eyes: RMCGlassesMedicalHUDGlasses
    belt: RMCBeltMedicBagSPP
    back: RMCSatchelMedicpack
  storage:
    back:
    - CMDefibrillator
    - CMHealthAnalyzer
    - CMSheetMetal20
    belt:
    - CMUpgradedTraumaKit10
    - CMUpgradedTraumaKit10
    - CMUpgradedBurnKit10
    - CMUpgradedBurnKit10
    # - RMCSplint
    # - RMCHyposprayOxycodone
    - CMPillCanisterBicaridine
    - CMPillCanisterKelotane
    - CMPillCanisterInaprovaline

- type: entity
  parent: CMSpawnPointJobBase
  id: RMCSpawnPointSPPSpetsnazMedic
  name: special survivor spp spetsnaz medic spawn point
  suffix: Sorokyne
  components:
  - type: SpawnPoint
    job_id: RMCSurvivorSPPSpetsnazMedic
  - type: Sprite
    state: surv_spp

- type: jobIcon
  parent: CMJobIconBase
  id: RMCJobIconSPPSpetsnazMedic
  icon:
    sprite: _RMC14/Interface/job_icons/SPP/spetsnaz.rsi
    state: spp_sptz_med
