    - [ RMCWeaponSMGPDW90, RMCMagazineSMGPDW90, RMCMagazineSMGPDW90 ]
    - [ RMCWeaponSMGM63WhiteNoLock, CMMagazineSMGM63, CMMagazineSMGM63 ]
