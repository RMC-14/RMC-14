# We-Ya Commandos
- type: job
  parent: RMCPMCLeader
  id: RMCWeYaCommandoLeader
  access: [ CMAccessERT ]
  name: rmc-job-name-weya-commando-leader
  playTimeTracker: RMCJobWeYaCommandoLeader
  startingGear: RMCGearWeYaCommandoLeader
  spawnMenuRoleName: We-Ya Commando Squad Leader
  special:
  - !type:AddComponentSpecial
    components:
    - type: NpcFactionMember
      factions:
      - WeYa
    - type: Language
      spokenLanguages:
      - English
      - Japanese
      understoodLanguages:
      - English
      - Japanese
      currentLanguage: English
      defaultLanguage: English
    - type: Skills
      skills:
        RMCSkillFirearms: 2
        RMCSkillPolice: 2
        RMCSkillFireman: 2
        RMCSkillConstruction: 2
        RMCSkillEngineer: 2
        RMCSkillCqc: 2
        RMCSkillLeadership: 1
        RMCSkillOverwatch: 1
        RMCSkillMedical: 2
        RMCSkillEndurance: 3
        RMCSkillJtac: 2
        RMCSkillVehicles: 1
    - type: MarineOrders
    - type: SquadLeader
      icon:
        sprite: _RMC14/Interface/job_icons/We-Ya/pmc.rsi
        state: pmc_ld
    - type: RMCPointing
    - type: JobPrefix
      prefix: rmc-job-prefix-pmc-leader
    - type: RMCTrackable
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: pmc_ld
      background:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: background_pmc

- type: entity
  parent: RMCRandomHumanoidPMCLeader
  id: RMCRandomHumanoidWeYaCommandoLeader
  name: we-ya commando ghost role leader
  suffix: Spawner, Player, Low Threat
  components:
  - type: RandomHumanoidSpawner
    settings: RMCWeYaCommandoLeader

- type: randomHumanoidSettings
  parent: RMCPMCLeader
  id: RMCWeYaCommandoLeader
  components:
  - type: GhostRole
    name: rmc-ghost-name-weya-commando-leader
    job: RMCWeYaCommandoLeader
    requirements:
    - !type:RoleTimeRequirement
      role: CMJobSquadLeader
      time: 18000 # 5 Hours

- type: startingGear
  id: RMCGearWeYaCommandoLeader
  equipment:
    id: CMIDCardCommando
    ears: RMCHeadsetDistressPMCLeader
    jumpsuit: RMCJumpsuitVeteranPMCCommando
    outerClothing: CMArmorM4PMCCommando
    gloves: RMCHandsVeteranPMCCommando
    head: RMCArmorHelmetPMCCommando
    shoes: RMCBootsPMCCommandoFilled
    mask: RMCMaskCoifPMC
    eyes: RMCGlassesHUDSecurity
    back: RMCSatchelPMCCommandoFilled
    belt: RMCBeltPMCFilledCommando
    pocket1: RMCPouchMedicalSocFill
    pocket2: RMCPouchMagazineLargePMC
    suitstorage: RMCWeaponRifleM54CWhiteCommando
  storage:
    back:
    - RMCRangefinder
    - RMCMotionDetector
    - RMCExplosiveBreachingCharge
    - RMCGrenadeBlastM12
    - RMCGrenadeBlastM12
    - RMCHandheldDistressBeaconWeYa
    pocket2:
    - CMMagazineRifleM54C
    - CMMagazineRifleM54C
    - CMMagazineRifleM54CAP
    - CMMagazineRifleM54CAP

- type: playTimeTracker
  id: RMCJobWeYaCommandoLeader
