- type: job
  parent: CMJobBase
  id: CMRoyalMarinesTeamLeader
  name: rmc-job-name-rcm-teamleader
  description: rmc-ghost-role-information-rcm-description
  playTimeTracker: RMCJobRoyalTeamLeader
  ranks:
    RMCRankTSESergeant: [ ]
  startingGear: RMCGearRoyalTeamLeader
  icon: "RMCJobIconRoyalTeamLeader"
  joinNotifyCrew: false
  supervisors: cm-job-supervisors-royal-lieutenant
  spawnMenuRoleName: RCM Team Leader
  special:
  - !type:AddComponentSpecial
    components:
    - type: NpcFactionMember
      factions:
      - RoyalMarines
      - TSE
    - type: Skills
      preset: RMCSkillPresetRoyalTeamLeader
    - type: MarineOrders
    - type: RMCPointing
    - type: CommandAccent
    - type: ViewIntelObjectives
    - type: SquadLeader
      icon:
        sprite: _RMC14/Interface/job_icons/TSE/RCM/standard.rsi
        state: rcm_teamleader
    - type: RMCTrackable
    - type: JobPrefix
      prefix: rmc-job-prefix-rcm-teamleader
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: rmc_teamleader
      background:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: background_twe
  hidden: true

- type: entity
  id: RMCRandomHumanoidRoyalMarinesTeamLeader
  name: royal crown marines ghost role team leader
  suffix: Spawner, Player, Friendly
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Head/Royal/ballistic.rsi
    state: icon
  - type: RandomHumanoidSpawner
    settings: RMCRoyalMarinesTeamLeader

- type: randomHumanoidSettings
  parent: RMCEventHumanoid
  id: RMCRoyalMarinesTeamLeader
  components:
  - type: GhostRole
    name: rmc-ghost-name-rcm-teamleader
    description: rmc-ghost-role-information-rcm-description
    rules: rmc-ghost-role-information-rcm-rules
    reregister: false
    job: CMRoyalMarinesTeamLeader
    raffle:
      settings: short
    requirements:
    - !type:RoleTimeRequirement
      role: CMJobSquadLeader
      time: 18000 # 5 Hours
  - type: GhostRoleApplySpecial
    squad: SquadRoyalMarines

- type: startingGear
  id: RMCGearRoyalTeamLeader
  equipment:
    head: RMCHeadRoyalBeretLead
    ears: RMCHeadsetRoyalMarineLeader
    jumpsuit: RMCJumpsuitMarineRoyalTeamLeader
    outerClothing: RMCArmorRoyalPaddedFilled
    gloves: RMCHandsVeteranRoyalMarine
    shoes: RMCBootsRoyalFilled
    suitstorage: RMCWeaponRifleL24
    id: RMCIDRoyalMarinesTeamLeader
    belt: RMCBeltHolsterPistolRCML54
    back: RMCBackpackRCMSmallPVPTeamLeader
    pocket1: RMCPouchToolsFilledRCM
    pocket2: RMCPouchMedkitFillRoyal

- type: playTimeTracker
  id: RMCJobRoyalTeamLeader

- type: jobIcon
  parent: CMJobIconBase
  id: RMCJobIconRoyalTeamLeader
  icon:
    sprite: _RMC14/Interface/job_icons/TSE/RCM/standard.rsi
    state: rcm_teamleader
