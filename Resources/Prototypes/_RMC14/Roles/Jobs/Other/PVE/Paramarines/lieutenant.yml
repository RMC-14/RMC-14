- type: job
  parent: CMJobBase
  id: CMRoyalMarinesParaLieutenantPVE
  name: rmc-job-name-rcm-pve-lieutenant
  description: rmc-ghost-role-information-rcm-description
  playTimeTracker: RMCJobRoyalParaLieutenantPVE
  requirements:
    - !type:RoleTimeRequirement
      role: CMJobExecutiveOfficer
      time: 10800 # 3 hours
  ranks:
    RMCRankTSESecondLieutenant: [ ]
  startingGear: RMCGearRoyalParaLieutenantPVE
  icon: "RMCJobIconRoyalParaLieutenantPVE"
  joinNotifyCrew: false
  supervisors: cm-job-supervisors-squadron-command
  accessGroups:
  - ShipMasterAccess
  spawnMenuRoleName: Royal Paramarine Lieutenant (PVE)
  special:
  - !type:AddComponentSpecial
    components:
    - type: NpcFactionMember
      factions:
      - RoyalMarines
      - TSE
    - type: Language
      spokenLanguages:
      - English
      - Japanese
      understoodLanguages:
      - English
      - Japanese
      currentLanguage: English
      defaultLanguage: English
    - type: Skills
      skills:
        RMCSkillConstruction: 1
        RMCSkillCqc: 3
        RMCSkillEndurance: 3
        RMCSkillEngineer: 2
        RMCSkillFirearms: 1
        RMCSkillFireman: 3
        RMCSkillJtac: 3
        RMCSkillLeadership: 2
        RMCSkillMedical: 2
        RMCSkillMeleeWeapons: 1
        RMCSkillOverwatch: 1
        RMCSkillPilot: 1
        RMCSkillSurgery: 2
    - type: MarineOrders
    - type: RMCPointing
    - type: CommandAccent
    - type: InnateCommandSpeech
    - type: RMCTrackable
    - type: JobPrefix
      prefix: rmc-job-prefix-rcm-pve-lieutenant
    - type: AssignSquad
      squad: SquadPara
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: rmc_lieutenant
      background:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: background_para
  hidden: true

- type: startingGear
  id: RMCGearRoyalParaLieutenantPVE
  equipment:
    head: RMCHeadCapPeakedPara
    ears: RMCHeadsetRoyalParaOfficerPVE
    jumpsuit: RMCJumpsuitMarineParaService
    outerClothing: RMCArmorParaVest
    belt: RMCBeltHolsterPistolParaM44
    gloves: RMCHandsVeteranRoyalMarine
    shoes: RMCBootsRoyalFilled
    id: RMCIDRoyalMarinesTroopCommanderPVE
    pocket1: RMCPouchToolsFilledRCM
    pocket2: RMCPouchMedkitFillRoyal

- type: entity
  parent: CMSpawnPointJobBase
  id: CMSpawnPointRCMPVEParaLieutenant
  name: paramarine lieutenant spawn point (PVE)
  components:
  - type: SpawnPoint
    job_id: CMRoyalMarinesParaLieutenantPVE
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Head/Royal/ballistic.rsi
    state: icon

- type: playTimeTracker
  id: RMCJobRoyalParaLieutenantPVE

- type: jobIcon
  parent: CMJobIconBase
  id: RMCJobIconRoyalParaLieutenantPVE
  icon:
    sprite: _RMC14/Interface/job_icons/TSE/RCM/paramarine.rsi
    state: para_lieutenant_pve
