    pocket2: RMCPouchMedkitFillRoyal
    outerClothing: RMCArmorParaVest

- type: playTimeTracker
  id: RMCJobParaPilotPVE

- type: entity
  parent: CMSpawnPointJobBase
  id: CMSpawnPointRCMPVEParaPilot
  name: paramarine pilot spawn point (PVE)
  components:
  - type: SpawnPoint
    job_id: CMRoyalMarinesParaPilotPVE
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Head/Royal/flighthelmet.rsi
    state: icon

- type: jobIcon
  parent: CMJobIconBase
  id: RMCJobIconParaPilotPVE
  icon:
    sprite: _RMC14/Interface/job_icons/TSE/RCM/paramarine.rsi
    state: para_pilot
