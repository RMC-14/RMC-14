- type: job
  parent: CMJobBase
  id: CMRoyalMarinesParaPilotPVE
  name: rmc-job-name-rcm-pve-pilot
  description: rmc-ghost-role-information-rcm-description
  playTimeTracker: RMCJobParaPilotPVE
  ranks:
    RMCRankTSESecondLieutenant: [ ]
  startingGear: RMCGearParaPilotPVE
  icon: "RMCJobIconParaPilotPVE"
  joinNotifyCrew: false
  supervisors: cm-job-supervisors-royal-lieutenant
  spawnMenuRoleName: Royal Paramarine Fleet Air Arm Pilot (PVE) 
  special:
  - !type:AddComponentSpecial
    components:
    - type: NpcFactionMember
      factions:
      - RoyalMarines
      - TSE
    - type: Language
      spokenLanguages:
      - English
      - Japanese
      understoodLanguages:
      - English
      - Japanese
      currentLanguage: English
      defaultLanguage: English
    - type: Skills
      skills:
        RMCSkillConstruction: 1
        RMCSkillCqc: 3
        RMCSkillEndurance: 3
        RMCSkillEngineer: 2
        RMCSkillFirearms: 1
        RMCSkillFireman: 3
        RMCSkillJtac: 2
        RMCSkillLeadership: 1
        RMCSkillMedical: 2
        RMCSkillOverwatch: 1
        RMCSkillPilot: 2
        RMCSkillPowerLoader: 2
        RMCSkillMeleeWeapons: 1
        RMCSkillSurgery: 1
    - type: JobPrefix
      prefix: rmc-job-prefix-rcm-pve-pilot
    - type: AssignSquad
      squad: SquadPara
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: pilot
      background:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: background_para
  hidden: true

- type: startingGear
  id: RMCGearParaPilotPVE
  equipment:
    head: RMCHeadRoyalFlightHelmet
    ears: RMCHeadsetRoyalParaLeaderPVE
    jumpsuit: RMCJumpsuitMarinePara
    gloves: RMCHandsVeteranRoyalMarine
