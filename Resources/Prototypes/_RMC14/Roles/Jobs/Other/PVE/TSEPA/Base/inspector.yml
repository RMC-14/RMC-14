        RMCSkillCqc: 3
        RMCSkillEndurance: 3
        RMCSkillEngineer: 1
        RMCSkillFirearms: 2
        RMCSkillFireman: 3
        RMCSkillJtac: 2
        RMCSkillLeadership: 2
        RMCSkillMedical: 2
        RMCSkillOverwatch: 1
        RMCSkillPolice: 1
