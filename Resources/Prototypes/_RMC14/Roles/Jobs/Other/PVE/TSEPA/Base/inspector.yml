  name: tsepa inspector spawn point
  suffix: PVE
  components:
  - type: SpawnPoint
    job_id: RMCTSEPAInspectorPVE
  - type: Sprite
    layers:
    - sprite: _RMC14/Objects/Clothing/OuterClothing/TSE/TSEPA/jacket.rsi
      state: icon

- type: playTimeTracker
  id: RMCJobTSEPAInspectorPVE
