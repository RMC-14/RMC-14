- type: job
  parent: CMJobBase
  id: RMCJobSynthetic
  name: rmc-job-name-synth
  description: rmc-job-description-synth
  playTimeTracker: RMCJobSynthetic
  ranks:
    RMCRankChiefWarrantOfficer:
    - !type:RoleTimeRequirement
      role: RMCJobSynthetic
      time: 270000 # 75 hours
    RMCRankWarrantOfficer: [ ]
  startingGear: RMCGearSyntheticEquipped
  dummyStartingGear: RMCGearSyntheticEquipped
  icon: "RMCJobIconSynth"
  joinNotifyCrew: true
  whitelisted: true
  supervisors: rmc-job-supervisors-commander
  accessGroups:
  - ShipMasterAccess
  - Synth
  roleWeight: 0.25
  special:
  - !type:AddComponentSpecial
    components:
    - type: Language
      spokenLanguages:
      - English
      - French
      - Japanese
      - Russian
      - Scandinavian
      - German
      - Chinese
      - Spanish
      - Hindi
      understoodLanguages:
      - English
      - French
      - Japanese
      - Russian
      - Scandinavian
      - German
      - Chinese
      - Spanish
      - Hindi
      currentLanguage: English
      defaultLanguage: English
    - type: LanguageLearning
      learnableLanguages:
      - Xeno
      firstContactLanguages:
      - Xeno
      comprehensionThreshold: 0.8
      learningRange: 8.0
      baseWordLearningRate: 0.05
    - type: CMVendorUser
      id: RMCJobSynthetic
      points: 45
      extraPoints:
        ExperimentalTools: 30
    - type: JobPrefix
      prefix: rmc-job-prefix-synth
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: synth
    - type: Synth

- type: startingGear
  id: RMCGearSyntheticEquipped
  equipment:
    gloves: CMHandsInsulated
    shoes: RMCShoesWhite
    id: RMCIDCardSynth
    ears: RMCHeadsetSynth
    belt: CMBeltUtilityFilled
    pocket1: RMCUniversalRecorder

- type: entity
  parent: CMSpawnPointJobBase
  id: RMCSpawnPointSynth
  name: synthetic spawn point
  components:
  - type: SpawnPoint
    job_id: RMCJobSynthetic
  - type: Sprite
    state: syn_spawn

- type: playTimeTracker
  id: RMCJobSynthetic
  isHumanoid: true
