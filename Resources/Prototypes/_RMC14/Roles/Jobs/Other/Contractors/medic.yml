    components:
    - type: NpcFactionMember
      factions:
      - VAI
    - type: Skills
      skills:
        RMCSkillSurgery: 1
        RMCSkillMedical: 2
        RMCSkillFireman: 1
        RMCSkillConstruction: 2
        RMCSkillEngineer: 2
        RMCSkillEndurance: 2
        RMCSkillFirearms: 1
