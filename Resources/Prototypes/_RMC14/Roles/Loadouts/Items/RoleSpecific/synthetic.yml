# These intentionally divert from CM's list.
# Glasses, Shoes, Gloves, Helmets, and Masks are mostly covered by standard loadouts.

# Uniforms
- type: loadout
  id: SynthUniformRMC
  equipment:
    jumpsuit: RMCJumpsuitSynthetic

- type: loadout
