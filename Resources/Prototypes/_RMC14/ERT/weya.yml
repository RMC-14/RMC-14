- type: entity
  id: RMCERTCallPMC
  name: "We-Ya PMC Response Team"
  categories: [ HideSpawnMenu ]
  components:
  - type: RMCERTCall
    organization: rmc-ert-organization-weya
    npcFactions: [ WeYa ]
    accessGroups: [ ShipMasterAccess, RMCERT ]
    iffFaction: FactionWeYa
    category: rmc-ert-category-corporate
    enabled: true
    adminSelectable: true
    adminButtonLabel: rmc-ert-admin-button-pmc
    randomWeight: 20
    allowedSources: [ Console, Handheld, Admin ]
    # TODO RMC14 replace with an exact /Maps/_RMC14/Shuttles/ERT/ert_pmc_shuttle.yml once ported.
    shuttleMap: /Maps/_RMC14/Shuttles/ERT/ert_pmc_shuttle.yml
    shuttleSpawner: RMCSpawnerERTShuttleWeYa
    shuttleSpawnMarker: RMCERTShuttleStartPadWeYa
    autoLaunch: true
    shuttleTravelTime: 40s
    landingTags: [ mainship ]
    roles:
    - id: leader
      name: rmc-ert-role-pmc-leader
      job: RMCPMCLeader
      ghostRoleEntityPool:
      - entity: RMCRandomHumanoidPMCLeader
        weight: 100
      min: 1
      max: 1
      leader: true
      roleTags: [ leader, command ]
      seatTags: [ command ]
      priority: 100
    - id: operator
      name: rmc-ert-role-pmc-operator
      job: RMCPMCStandardM63B2
      ghostRoleEntityPool:
      - entity: RMCRandomHumanoidPMCStandardM63B2
        weight: 100
      min: 1
      max: 1
      roleTags: [ rifleman ]
      seatTags: [ troop ]
    - id: medic
      name: rmc-ert-role-pmc-medic
      job: RMCPMCMedic
      ghostRoleEntityPool:
      - entity: RMCRandomHumanoidPMCMedic
        weight: 100
      min: 1
      max: 2
      roleTags: [ medic ]
      seatTags: [ medic, troop ]
      priority: 50
    - id: gunner
      name: rmc-ert-role-pmc-gunner
      job: RMCPMCGunner
      ghostRoleEntityPool:
      - entity: RMCRandomHumanoidPMCGunner
        weight: 100
      min: 0
      max: 1
      required: false
      roleTags: [ smartgunner, rifleman ]
      seatTags: [ troop ]
      priority: 30
    - id: sniper
      name: rmc-ert-role-pmc-sniper
      job: RMCPMCSniper
      ghostRoleEntityPool:
      - entity: RMCRandomHumanoidPMCSniper
        weight: 100
      min: 0
      max: 1
      required: false
      roleTags: [ specialist, rifleman ]
      seatTags: [ troop ]
      priority: 30
    announcements:
      arrival:
        title: rmc-ert-announcement-title-intercepted-transmission
        message: rmc-ert-announcement-pmc-arrival
    requirements:
      cooldown: 10m
      recruitmentDuration: 1m
      maxCallsPerRound: 1
      minRequiredSlots: 3
      maxSlots: 6

