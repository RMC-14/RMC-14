- type: entity
  parent: CMFloorShallowWaterEntity
  id: RMCEntityDesertWaterShallow
  components:
  - type: Sprite
    sprite: _RMC14/Tiles/planet/desert_water.rsi
    layers:
    - state: shallow
      map: [ "base" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PurifiableWaterLayers.Layer:
        base:
          Toxic: { sprite: _RMC14/Tiles/planet/desert_water.rsi, state: shallow_toxic }
          Dispersing: { sprite: _RMC14/Tiles/planet/desert_water_transition.rsi, state: shallow }
          Purified: { sprite: _RMC14/Tiles/planet/desert_water.rsi, state: shallow }

