- type: entity
  abstract: true
  id: RMCHiveBoonBase
  name: hive boon
  components:
  - type: HiveBoonDefinition
    cost: 1

- type: entity
  parent: RMCHiveBoonBase
  id: RMCHiveBoonFireResistance
  name: Boon of Fire Resistance
  description: Makes all xenonids immune to fire for 5 minutes.
  components:
  - type: HiveBoonDefinition
    duration: 5m
    duplicateId: RMCHiveBoonFireResistance
    event: !type:HiveBoonActivateFireResistanceEvent

- type: entity
  parent: RMCHiveBoonBase
  id: RMCHiveBoonEvolution
  name: Minor Boon of Evolution
  description: Doubles evolution speed for 5 minutes.
  components:
  - type: HiveBoonDefinition
    duration: 5m
    duplicateId: RMCHiveBoonEvolution
    event: !type:HiveBoonActivateEvolutionEvent
  - type: EvolutionBonus
    amount: 0.5

- type: entity
  parent: RMCHiveBoonBase
  id: RMCHiveBoonAggression
  name: Minor Boon of Aggression
  description: Increases all xenonid damage by 5 for 5 minutes.
  components:
  - type: HiveBoonDefinition
    duration: 5m
    duplicateId: RMCHiveBoonAggression
    event: !type:HiveBoonActivateAggressionEvent
  - type: HiveBoonMeleeDamage
    amount: 5

- type: entity
  parent: RMCHiveBoonBase
  id: RMCHiveBoonEvolutionMajor
  name: Major Boon of Evolution
  description: Doubles evolution speed for 10 minutes, and allows evolution progress without an ovipositor.
  components:
  - type: HiveBoonDefinition
    cost: 2
    pylons: 2
    duration: 10m
    unlockAt: 60m
    duplicateId: RMCHiveBoonEvolutionMajor
    event: !type:HiveBoonActivateEvolutionEvent
  - type: EvolutionBonus
    amount: 0.5
  - type: EvolutionIgnoreGranter

- type: entity
  parent: RMCHiveBoonBase
  id: RMCHiveBoonAggressionMajor
  name: Major Boon of Aggression
  description: Increases all xenonid damage by 10 for 10 minutes.
  components:
  - type: HiveBoonDefinition
    cost: 2
    pylons: 2
    duration: 10m
    unlockAt: 60m
    duplicateId: RMCHiveBoonAggressionMajor
    event: !type:HiveBoonActivateAggressionEvent
  - type: HiveBoonMeleeDamage
    amount: 10

- type: entity
  parent: RMCHiveBoonBase
  id: RMCHiveBoonAdaptability
  name: Boon of Adaptability
  description: Allows each xenonid to change to a different caste of the same tier.
  components:
  - type: HiveBoonDefinition
    cost: 2
    pylons: 2
    unlockAt: 60m
    duplicateId: RMCHiveBoonAdaptability
    event: !type:HiveBoonActivateAdaptabilityEvent

- type: entity
  parent: RMCHiveBoonBase
  id: RMCHiveBoonLarvaSurge
  name: Surge of Larva
  description: Provides 5 larva instantly to the hive.
  components:
  - type: HiveBoonDefinition
    cost: 5
    reusable: false
    duplicateId: RMCHiveBoonLarvaSurge
    event: !type:HiveBoonActivateLarvaSurgeEvent

- type: entity
  parent: RMCHiveBoonBase
  id: RMCHiveBoonKing
  name: His Grace
  description: A huge behemoth of a Xenonid which can tear its way through defences and flesh alike. Requires open space around the hive core to spawn.
  components:
  - type: HiveBoonDefinition
    cost: 0
    pylons: 2
    cooldown: 15m
    unlockAt: 90m
    unlockAtRandomAdd: 25m
    duplicateId: RMCHiveBoonKing
    noLivingKing: true
    requiresCore: true
    event: !type:HiveBoonActivateKingEvent

- type: entity
  parent: BaseHiveStructure
  id: RMCHiveCocoonKing
  name: alien cocoon
  description: A large pulsating cocoon.
  components:
  - type: Transform
    anchored: true
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        layer:
        - BulletImpassable
        density: 200
      xeno_hive_core:
        shape:
          !type:PhysShapeCircle
          radius: 1
        hard: false
        mask:
        - SmallMobLayer
  - type: CollisionWake
    enabled: false
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/king_cocoon.rsi
    state: growing
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 4000
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: WarpPoint
    location: alien cocoon
  - type: RMCTrackable
  - type: HiveKingCocoon
  - type: MeleeReceivedMultiplier
    xenoDamage: {}
