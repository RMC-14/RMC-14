# CMB Deputy
- type: randomHumanoidSettings
  parent: RMCCorpse
  id: RMCCorpseDeputyShiva
  components:
  - type: Loadout
    prototypes: [ RMCGearCorpseDeputyShiva ]
  - type: VictimBurst
  - type: Rank
    rank: RMCRankCMBDeputy
  - type: Marine
    icon:
      sprite: _RMC14/Interface/job_icons/CMB.rsi
      state: cmb_dep
