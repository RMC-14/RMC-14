- type: entity
  parent: [ RMCMobCorgi, StripableInventoryBase]
  id: RMCMobK9Unit
  name: military dog
  description: A trained dog of war.
  suffix: PVE
  components:
  - type: Sprite
# TODO crit and dead sprite should invis equipped gear (better than it floating)
    sprite: _RMC14/Mobs/Animals/k9s/k9.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: body
    - map: [ "id" ]
    - map: [ "tongueOut" ]
      state: head
    - map: [ "neck" ]
    - map: [ "back" ]
    - map: [ "head" ]
    - map: [ "ears" ]
    - map: [ "eyes" ]
    - map: [ "acided" ]
  - type: MobThresholds
    thresholds:
      0: Alive
      75: Critical
      150: Dead
  - type: Marine # Need to be effected by all the things that effect marines
  - type: Input
    context: "xenonid" # Needed for wideswing to work
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.7
    baseSprintSpeed: 6.5
  - type: SlowOnPull
    slowdowns:
    - multiplier: 0.745
      whitelist:
        components:
        - Marine
    - multiplier: 0.855
      whitelist:
        components:
        - XenoLight
    - multiplier: 0.5775
      whitelist:
        components:
        - XenoHeavy
    - multiplier: 0.645
      whitelist:
        tags:
        - BodyBag
    - multiplier: 0.645
      whitelist:
        components:
        - RequisitionsCrate #Lockers/Crates
  - type: RMCSize
    size: Small
  - type: DamageStateVisuals
    states:
      Alive:
        Base: body
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: MeleeDamageMultiplier
    whitelist:
      components:
      - Xeno
  - type: MeleeWeapon
    autoAttack: true
    widePrimary: true
    altDisarm: true
    angle: 0
    damage:
      types:
        Piercing: 20
  - type: GenericVisualizer
    visuals:
      enum.MobStateVisuals.State:
        tongueOut:
          Alive: { visible: true }
          Critical: { visible: false }
          Dead: { visible: false }
      enum.ToggleableVisuals.Enabled:
        tongueOut:
          True: { state: head_on }
          False: { state: head }
      enum.UserAcidedVisuals.Acided:
        acided:
          None:
            visible: false
          Normal:
            sprite: _RMC14/Effects/xeno_spray_acid.rsi
            state: human_acid
            visible: true
          Enhanced:
            sprite: _RMC14/Effects/xeno_spray_acid.rsi
            state: human_acid_enhanced
            visible: true
  - type: Puller # Handless dog can still pull things
    needsHands: false
  - type: RMCStamina
  - type: DamageMobState
    critDamage:
      types:
        Asphyxiation: 1
    nonDeadDamage:
      types:
        Asphyxiation: -0.33
  - type: Language
    spokenLanguages:
      - Canine
    understoodLanguages:
      - English
      - Canine
    currentLanguage: Canine
    defaultLanguage: Canine
  - type: MobStateActions
    actions:
      Critical:
      - CMActionGhost
      Dead:
      - CMActionGhost
  - type: NpcFactionMember
    factions:
    - UNMC
  - type: StunShakeable # Dogs can shake people awake
  - type: StunShakeableUser
  - type: MindCheck
  - type: Spottable
  - type: ActiveInputMover
  - type: FiremanCarriable # Sure
  - type: BlockEntityStorage
    whitelist:
      components:
      - CanBeSupplyDropped
  - type: TacticalMapTracked
  - type: MarineMapTracked
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: synth_k9
    background:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: background
  - type: RMCSetPose
  - type: Evasion
  - type: CanBeFirePatted
  - type: RMCPickupDroppedItems
  - type: RMCSpeciesSlowdownModifier
    slowModifier: 2
    superSlowModifier: 4
  - type: RMCBuckleDrawDepth
  - type: RMCObstacleSlamming
  - type: CombatMode
    canDisarm: true
  - type: RMCDisarm
  - type: RMCDisarmable
  - type: StunOnExplosionReceived
  - type: DeafenWhileCrit
  - type: AffectableByWeeds
  - type: UserIFF
  - type: UserLimitHits
  - type: ImmuneToClothingRequiredStepTrigger
  - type: XenoToggleChargingDamage
    damage:
      types:
        Blunt: 0.25 # TODO RMC14 to the chest only
    armorPiercingDamage:
      types:
        Blunt: 1
    armorPiercing: 13
    defaultMultiplier: 5
    stageMultipliers:
      8: 8
  - type: XenoToggleChargingKnockback
  - type: XenoToggleChargingParalyze
  - type: RMCMobStateDrawDepth
    drawDepths:
      Dead: BelowMobs
  - type: FixedIdentity
    name: cm-chatsan-replacement-dog
    whitelist:
      components:
      - Xeno
  - type: RMCHealthIcons
  - type: RMCMesonsNonviewable
    xenoVisible: true
  - type: StatusIcon
    bounds: -0.5,-0.5,0.5,0.5
  - type: IdExaminable
  - type: Climbing
  - type: Buckle
  - type: MobGibbedByExplosionType
  - type: RMCCanBeFultoned
  - type: StatusEffects
    allowed:
    - Stun
    - KnockedDown
    - SlowedDown
    - Stutter
    - Electrocution
    - ForcedSleep
    - TemporaryBlindness
    - Drunk
    - SlurredSpeech
    - RatvarianLanguage
    - PressureImmunity
    - Muted
    - Pacified
    - StaminaModifier
    - Flashed
    - Dazed
    - Blinded
    - Deaf
    - Unconscious
  - type: SolutionContainerManager
  - type: InjectableSolution
    solution: chemicals
  - type: Bloodstream
    bloodReagent: Blood
    bloodMaxVolume: 280
    maxBleedAmount: 50
    bleedReductionAmount: 0
    bloodRefreshAmount: 0.15
    bloodlossDamage:
      types:
        Bloodloss: 0.5
    bloodlossHealDamage:
      types:
        Bloodloss: -1
    damageBleedModifiers: CMBloodlossHuman
  - type: Speech
    allowedEmotes: [ 'Bark', 'Snarl', 'Whine', 'Growl', 'Yip' ]
  - type: Vocal
    screamAction: null
    sounds:
      Male: RMCUnisexVulpkanin
      Female: RMCUnisexVulpkanin
      Unsexed: RMCUnisexVulpkanin
  - type: Inventory
    speciesId: k9
    templateId: RMCK9
    displacements:
      neck:
        sizeMaps:
          32:
            sprite: _RMC14/Mobs/Animals/k9s/displacements.rsi
            state: neck
      ears:
        sizeMaps:
          32:
            sprite: _RMC14/Mobs/Animals/k9s/displacements.rsi
            state: head-ears-eyes
      eyes:
        sizeMaps:
          32:
            sprite: _RMC14/Mobs/Animals/k9s/displacements.rsi
            state: head-ears-eyes
      head:
        sizeMaps:
          32:
            sprite: _RMC14/Mobs/Animals/k9s/displacements.rsi
            state: head-ears-eyes
  - type: RandomMetadata
    nameSegments:
     - rmc_dog_names
    nameFormat: random-metadata-name-format-default
  - type: Grammar
    attributes:
      proper: true
  - type: NameIdentifier
    group: null
  - type: Tag
    tags:
    - RMCK9
  # - type: ActionGrant TODO RMC14 requires some code to make this work
  #  actions:
  #  - ActionTogglePanting

- type: entity
  parent: RMCMobK9Unit
  id: RMCMobK9UnitHands
  suffix: PVE, hand
  components:
  - type: Puller
    needsHands: true
  - type: Hands
    hands:
      hand_left:
        location: Left
    sortedHands:
      - hand_left
    leftHandDisplacement:
      sizeMaps:
        32:
          sprite: _RMC14/Mobs/Animals/k9s/displacements.rsi
          state: hand-left

- type: Tag
  id: RMCK9

- type: Tag
  id: RMCK9Wearable

- type: entity
  parent: ActionToggleWagging
  id: ActionTogglePanting
  name: Tongue Out
  description: Start or stop sticking your tongue out.
  components:
  - type: Action
    icon: { sprite: _RMC14/Mobs/Animals/k9s/k9.rsi, state: head }
    iconOn: { sprite: _RMC14/Mobs/Animals/k9s/k9.rsi, state: head_on }
    itemIconStyle: NoItem
    useDelay: 1
