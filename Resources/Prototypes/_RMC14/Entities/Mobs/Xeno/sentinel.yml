- type: entity
  parent:
  - CMXenoDeveloped
  - CMXenoTail
  - CMXenoFlammable
  - RMCXenoSpeechSounds
  - RMCXenoCommendationReceiver
  - RMCXenoMobCollision
  - RMCXenoVentCrawler
  id: CMXenoSentinel
  name: Sentinel
  description: A slithery, spitting kind of alien.
  components:
  - type: GuideHelp
    guides:
    - RMCGuideRoleSentinel
  - type: Sprite
    sprite: _RMC14/Mobs/Xenonids/Sentinel/sentinel.rsi
  - type: MobState
    allowedStates:
    - Alive
    - Critical
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      550: Critical
      650: Dead
  - type: Tag
    tags:
    - DoorBumpOpener
    - RMCSynthGrabbable
  - type: Xeno
    role: CMXenoSentinel
    actionIds:
    - ActionXenoRest
    - ActionXenoRegurgitate
    - ActionXenoWatch
    - ActionXenoTailStabSentinel
    - ActionXenoAcidWeak
    - ActionXenoParatoxinSpit
    - ActionXenoParatoxinSlash
    - ActionXenoDrainingBite
    - ActionXenoDevolve
    tier: 1
    hudOffset: -0.15,0.157
    unlockAt: 300 # 5 minutes
  - type: XenoLight
  - type: XenoDevolve
    devolvesTo:
    - CMXenoLarva
    canBeDevolvedByOther: false
  - type: XenoDevour
  - type: XenoPlasma
    plasma: 400
    maxPlasma: 400
    plasmaRegenOnWeeds: 3
  - type: CMArmor
    explosionArmor: 10
  - type: XenoEvolution
    canEvolveWithoutGranter: true
    max: 200
    evolvesTo:
    - CMXenoSpitter
    evolvesToWithoutPoints:
    - CMXenoQueen
  - type: XenoAcid
  - type: XenoSlowingSpit
    plasmaCost: 30
    projectileId: XenoParatoxinSpitProjectile 
  - type: MeleeWeapon
    damage:
      groups:
        Brute: 22.5
  - type: XenoTailStab
    bonusDamageMult: 1
    tailDamage:
      groups:
        Brute: 25
  - type: CatalyticTailStab
    damagePerStack:
      types:
        Heat: 1.2
  - type: XenoParatoxinSlashApply
  - type: XenoDrainingBite
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.7
    baseSprintSpeed: 5
  - type: SlowOnPull
    slowdowns:
    - multiplier: 0.53
      whitelist:
        components:
        - Marine
    - multiplier: 0.59
      whitelist:
        components:
        - XenoLight
    - multiplier: 0.375
      whitelist:
        components:
        - XenoHeavy
  - type: Tackle
    min: 4
    max: 4
    chance: 0.5
    stunMin: 4
    stunMax: 4
  - type: RMCXenoDamageVisuals
    prefix: sentinel
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: sentinel
  - type: AcidTrap
    trapLevel: 1
    cost: 70
    spray: XenoAcidSprayTrapWeak
  - type: IntelRecoverCorpseObjectiveOnDeath
    value: 0.1
  - type: FixedIdentity
    name: cm-job-name-xeno-sentinel
  - type: RMCSurgeryXenoHeart
    item: RMCOrganXenoHeartT1
  - type: VentCrawler
    ventCrawlIcon: sentinel
  - type: RMCActionOrder
    id: CMXenoSentinel
