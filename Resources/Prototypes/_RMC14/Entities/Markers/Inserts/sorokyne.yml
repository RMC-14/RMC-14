  parent: RMCMapInsertBase
  id: RMCMapInsertSorokyneBase
  suffix: Insert Sorokyne
  components:
  - type: MapInsert
    clearEntities: true
    clearDecals: true
    replaceAreas: true

- type: entity
  parent: RMCMapInsertSorokyneBase
