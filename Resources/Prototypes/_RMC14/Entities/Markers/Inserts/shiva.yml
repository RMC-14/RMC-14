# Shiva Base
- type: entity
  abstract: true
  parent: RMCMapInsertBase
  id: RMCMapInsertShivaBase
  suffix: Insert Shiva
  components:
  - type: MapInsert
    clearEntities: true
    clearDecals: true
    replaceAreas: true


# Standalones
- type: entity
  parent: RMCMapInsertShivaBase
  id: RMCMapInsertShivaSouthCaves
  name: LZ2 South Caves
  suffix: Insert Shiva
  components:
  - type: MapInsert
    variations:
    - spawn: "/Maps/_RMC14/Inserts/Shiva/builtup_lz2-south-caves.yml"
      probability: 0.30
    - spawn: "/Maps/_RMC14/Inserts/Shiva/destroyed_lz2-south-caves.yml"
      probability: 0.20


# Survivor Scenario Inserts
- type: entity
  abstract: true
  parent: RMCMapInsertShivaBase
  id: RMCMapInsertShivaBaseScenario
  suffix: Insert Shiva
  components:
  - type: MapInsert
    replaceAreas: false

# Panic Room
- type: entity
  parent: RMCMapInsertShivaBaseScenario
  id: RMCMapInsertShivaPanicRoomHold
  name: Panic Room Hold
  suffix: Insert Shiva
  components:
  - type: MapInsert
    variations:
    - spawn: "/Maps/_RMC14/Inserts/Shiva/panic_room_hold.yml"
      probability: 1
      nightmareScenario: panic_room_hold
      offset: 0,2

# CLF Raid
- type: entity
  parent: RMCMapInsertShivaBase
  id: RMCMapInsertShivaCLFRaid
  name: CLF Raid
  suffix: Insert Shiva
  components:
  - type: MapInsert
    variations:
    - spawn: "/Maps/_RMC14/Inserts/Shiva/clf_raid_shivas.yml"
      probability: 1
      nightmareScenario: clfraid_shivas

# Regular Surv Spawns
- type: entity
  parent: RMCMapInsertShivaBaseScenario
  id: RMCMapInsertShivaSurvSpawnTogether
  name: Together Surv Spawn
  suffix: Insert Shiva
  components:
  - type: MapInsert
    variations:
    - spawn: "/Maps/_RMC14/Inserts/Shiva/surv_spawn_church.yml"
      probability: 0.2
      nightmareScenario: none
    - spawn: "/Maps/_RMC14/Inserts/Shiva/surv_spawn_command_centre.yml"
      probability: 0.2
      nightmareScenario: none
      offset: 3,-21
    - spawn: "/Maps/_RMC14/Inserts/Shiva/surv_spawn_botany.yml"
      probability: 0.2
      nightmareScenario: none
      offset: -16,-36
    - spawn: "/Maps/_RMC14/Inserts/Shiva/surv_spawn_crisis_centre.yml"
      probability: 0.2
      nightmareScenario: none
      offset: 0,-62
    - spawn: "/Maps/_RMC14/Inserts/Shiva/surv_spawn_garage.yml"
      probability: 0.2
      nightmareScenario: none
      offset: 28,-46

# LZ2 Scenarios
- type: entity
  parent: RMCMapInsertShivaBase
  id: RMCMapInsertShivaLZ2Scenarios
  name: LZ2 Scenarios
  suffix: Insert Shiva
  components:
  - type: MapInsert
    variations:
    - spawn: "/Maps/_RMC14/Inserts/Shiva/lz2_scenario1.yml" # "lz2-southwest": "full", "lz2-south-gate": "half", "lz2-southeast": "none", "lz2-eastsouth": "half", "lz2-southeast-gate": "none", "lz2-east": "none", "lz2-east-gate": "full", "lz2-north": "full"
      probability: 0,17
    - spawn: "/Maps/_RMC14/Inserts/Shiva/lz2_scenario2.yml" # "lz2-southwest": "half", "lz2-south-gate": "full", "lz2-southeast": "full", "lz2-eastsouth": "none", "lz2-southeast-gate": "open", "lz2-east": "half", "lz2-east-gate": "none", "lz2-north": "open"
      probability: 0,17
    - spawn: "/Maps/_RMC14/Inserts/Shiva/lz2_scenario3.yml" # "lz2-southwest": "half", "lz2-south-gate": "none", "lz2-southeast": "half", "lz2-eastsouth": "full", "lz2-southeast-gate": "full", "lz2-east": "none", "lz2-east-gate": "half", "lz2-north": "none"
      probability: 0,17
    - spawn: "/Maps/_RMC14/Inserts/Shiva/lz2_scenario4.yml" # "lz2-southwest": "full", "lz2-south-gate": "none", "lz2-southeast": "half", "lz2-eastsouth": "none", "lz2-southeast-gate": "open", "lz2-east": "full", "lz2-east-gate": "none", "lz2-north": "open"
      probability: 0,17