# TSEPA Surplus
- type: entity
  parent: ColMarTechBase
  id: RMCColMarTechSurplusTSEPAPVE
  name: TSEPA surplus clothing rack
  description: An automated rack hooked up to a large storage of standard TSEPA clothing.
  suffix: PVE, TSEPA
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/clothing.rsi
  - type: CMAutomatedVendor
    jobs:
    - RMCTSEPAConstablePVE
    - RMCTSEPASeniorConstablePVE
    - RMCTSEPASergeantPVE
    - RMCTSEPAInspectorPVE
    hackable: true
    sections:
    - name: Surplus Equipment
      entries:
      - id: RMCJumpsuitTSEPA
        name: standard uniform
        amount: 15
      - id: CMBootsBlack
        name: boots
        amount: 15
      - id: RMCHandsBlack
        name: gloves
        amount: 15
      - id: RMCHeadCapTSEPA
        amount: 15
      - id: RMCHeadsetTSEPAConstable
        name: radio headset
        amount: 15
      - id: RMCM5CameraGear
        amount: 15
    - name: Armor
      entries:
      - id: RMCArmourM4TSEPA
        recommended: true
        name: light armor
        amount: 15
      - id: RMCArmorVestTSEPA
        name: armored vest
        amount: 15
    - name: Jackets
      entries:
      - id: RMCCoatTSEPA
        recommended: true
        name: field jacket
        amount: 15
      - id: RMCCoatTSEPAHighVis
        name: high-visibility jacket
        amount: 15
      - id: RMCCoatTSEPAHighVisVest
        name: high-visibility vest
        amount: 15
    - name: Backpacks
      entries:
      - id: RMCSatchelTSEPA
        recommended: true
        amount: 15
    - name: Pouches
      entries:
      - id: RMCPouchDocumentSmall
        recommended: true
        amount: 10
      - id: RMCPouchSecurityTools
        recommended: true
        amount: 10
      - id: RMCPouchGeneralLarge
        amount: 10
      - id: RMCPouchFirstResponder
        amount: 10
    - name: Miscellaneous
      entries:
      - id: RMCSunglasses
        name: sunglasses
        amount: 10
      - id: RMCTieBlack
        amount: 10
      - id: RMCWatchCheap
        name: wristwatch
        amount: 10

