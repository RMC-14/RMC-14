# MEDICAL

- type: entity
  parent: ColMarTechBase
  id: ColMarTechCrewMedicalEquipment
  name: ColMarTech medical equipment rack
  description: An automated equipment vendor for the Medical Department.
  components:
  - type: AccessReader
    access:
    - [ "CMAccessMedical" ]
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/medical_equipment.rsi
  - type: CMAutomatedVendor
    jobs:
    - CMNurse
    - CMDoctor
    - RMCFieldDoctor
    - CMResearcher
    - CMCMO
    sections:
    - name: Medical Set (Mandatory)
      jobs:
      - CMDoctor
      - RMCFieldDoctor
      - CMCMO
      takeAll: CMMedicalSet
      entries:
      - id: RMCVendorBundleCrewMedicalEssentialsDoctor
    - name: Medical Set (Mandatory)
      jobs:
      - CMNurse
      takeAll: CMMedicalSet
      entries:
      - id: CMVendorBundleCrewMedicalEssentialsNurse
    - name: Standard Equipment
      jobs:
      - CMNurse
      - CMDoctor
      - RMCFieldDoctor
      - CMCMO
      takeAll: CMStandard
      entries:
      - id: CMHandsLatex
      - id: CMHeadsetMedical
    - name: Eyewear
      jobs:
      - CMNurse
      - CMDoctor
      - RMCFieldDoctor
      - CMCMO
      choices: { CMEyewear: 1 }
      entries:
      - id: RMCGlassesMedicalHUDGlasses
#      - id: Prescription Medical HUD Glasses
    - name: Uniform
      choices: { CMUniform: 1 }
      jobs:
      - CMNurse
      entries:
      - id: RMCScrubsLightBlue
        recommended: true
      - id: RMCScrubsPharm
      - id: CMScrubsPurple
      - id: RMCScrubsOlive
      - id: RMCScrubsGrey
      - id: RMCScrubsBrown
      - id: RMCScrubsWhite
      - id: RMCScrubsBlack
