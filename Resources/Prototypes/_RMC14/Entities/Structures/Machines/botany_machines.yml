      components:
      - Xeno
  - type: ApcPowerReceiver
    powerLoad: 200
    needsPower: true
  - type: RMCPowerReceiver
    idleLoad: 5
    activeLoad: 200
    channel: Equipment
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno

