          - FloraDataDisc
      gene_editor_seed:
        name: Seed Packet
        swap: false
        insertSound: /Audio/Machines/id_insert.ogg
        ejectSound: /Audio/Machines/id_insert.ogg
        whitelist:
          components:
          - RMCPlantSeed
  - type: ContainerContainer
    containers:
      gene_editor_disc: !type:ContainerSlot
      gene_editor_seed: !type:ContainerSlot
  - type: GeneEditor
  - type: ActivatableUI
    key: enum.GeneEditorUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.GeneEditorUiKey.Key:
