- type: entity
  parent: CMBaseStructureCorrodible
  id: RMCCryoCell
  name: cryo cell
  description: A donation from the old A.W. project, using cryogenic technology. It slowly heals whoever is inside the tube.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Structures/Machines/Medical/cryo_cell.rsi
    drawdepth: Mobs
    noRot: true
    layers:
    - state: cell-off-empty
      map: ["enum.CryoCellVisualLayers.Base"]
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 200
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ApcPowerReceiver
    powerLoad: 250
    needsPower: true
  - type: RMCPowerReceiver
    idleLoad: 20
    activeLoad: 200
    channel: Equipment
  - type: DragInsertContainer
    containerId: cryo_cell
    entryDelay: 2
    delaySelfEntry: true
  - type: NoStunOnExit
  - type: ContainerContainer
    containers:
      cryo_cell: !type:ContainerSlot { }
      beakerSlot: !type:ContainerSlot { }
  - type: ItemSlots
    slots:
      beakerSlot:
        whitelist:
          components:
          - FitsInDispenser
  - type: CryoCell
  - type: UserInterface
    interfaces:
      enum.CryoCellUIKey.Key:
        type: CryoCellBui
  - type: ActivatableUI
    key: enum.CryoCellUIKey.Key
  - type: ActivatableUIRequiresPower
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.CryoCellVisuals.Occupied:
        enum.CryoCellVisualLayers.Base:
          Empty: { state: cell-on-empty }
          Occupied: { state: cell-on-occupied }
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: InsertBlacklist
    blacklist:
      components:
      - Xeno
  - type: RMCMesonsNonviewable
