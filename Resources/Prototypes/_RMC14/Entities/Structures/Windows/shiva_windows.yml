  description: It is very thin.
  components:
  - type: Corrodible
    isCorrodible: true
  - type: Sprite
    sprite: _RMC14/Structures/Windows/ice.rsi
    state: ice_wall
  - type: Icon
    sprite: _RMC14/Structures/Windows/ice.rsi
