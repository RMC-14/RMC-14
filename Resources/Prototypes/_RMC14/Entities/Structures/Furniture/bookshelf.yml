- type: entity
  parent: Bookshelf
  id: RMCBookcase
  name: bookcase
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/bookshelf.rsi
    snapCardinals: true
    layers:
      - state: bookcase
      - state: book-0
      - map: ["enum.StorageFillLayers.Fill"]
  - type: Appearance
  - type: StorageFillVisualizer
    maxFillLevels: 10
    fillBaseName: book
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          CMSheetMetal1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Storage
    grid:
    - 0,0,17,1
  - type: Occluder
    enabled: false
  - type: RMCMesonsNonviewable

- type: entity
  parent: RMCBookcase
  id: RMCBookcaseMedical
  name: medical manuals bookcase
  components:
  - type: StorageFill
    contents:
      - id: RMCGuidebookMedical
        amount: 3
      - id: RMCGuidebookSurgery
        amount: 2
      - id: RMCGuidebookChemistry
        amount: 2

- type: entity
  parent: RMCBookcase
  id: RMCBookcaseEngineering
  name: engineering manuals bookcase
  components:
  - type: StorageFill
    contents:
      - id: RMCGuidebookConstruction
        amount: 2
      - id: RMCGuidebookEngineering
        amount: 2
      - id: RMCGuidebookTelecomms
        amount: 2
      - id: RMCGuidebookReactor
        amount: 2
