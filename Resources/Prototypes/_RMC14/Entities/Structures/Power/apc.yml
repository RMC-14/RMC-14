- type: entity
  abstract: true
  id: CMApcBase
  name: area power controller
  description: A control terminal for the area electrical systems.
  categories: [ HideSpawnMenu ]
  components:
  - type: GuideHelp
    guides:
    - RMCGuideRoleCombatTechnician
  - type: Transform
    anchored: true
  - type: AccessReader
    access: [ [ "CMAccessEngineering" ], [ "CMAccessColonyEngineering" ] ]
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _RMC14/Structures/Power/apc.rsi
    layers:
    - state: base
      map: [ "base" ]
    - state: panel
      map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      visible: false
    - state: display-charging
      shader: unshaded
      map: [ "enum.ApcVisualLayers.ChargeState" ]
    - state: apcox-0
      shader: unshaded
      map: [ "enum.ApcVisualLayers.InterfaceLock" ]
    - state: apcox-1
      shader: unshaded
      map: [ "enum.ApcVisualLayers.PanelLock" ]
    - state: apco0-2
      shader: unshaded
      map: [ "enum.ApcVisualLayers.Equipment" ]
    - state: apco1-2
      shader: unshaded
      map: [ "enum.ApcVisualLayers.Lighting" ]
    - state: apco2-2
      shader: unshaded
      map: [ "enum.ApcVisualLayers.Environment" ]
  - type: Icon
    sprite: _RMC14/Structures/Power/apc.rsi
    state: base
  - type: Appearance
  - type: WallMount
    arc: 360
  - type: WiresPanel
  - type: Wires
    alwaysRandomize: true
    boardName: wires-board-name-apc
    layoutId: RMCAPC
  - type: WiresVisuals
  - type: UserInterface
    interfaces:
      enum.RMCApcUiKey.Key:
        type: RMCApcBui
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: ActivatableUI
    key: enum.RMCApcUiKey.Key
  - type: Construction
    graph: CMApc
    node: apc
  - type: Corrodible
    isCorrodible: false
  - type: RMCApc
  - type: ActivatableUIBlacklist
    blacklist:
      components:
      - Xeno
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Breakage"]
  - type: PointLight
    enabled: true
    castShadows: false
    radius: 1.5
  - type: GenericVisualizer
    visuals:
      enum.RMCApcVisualsLayers.Layer:
        base:
          Working: { state: base }
          WiresExposed: { state: apcewires }
          CoverOpenBattery: { state: apc2 }
          CoverOpenNoBattery: { state: apc1 }
          CoverRemovedBattery: { state: apc2-nocover }
          CoverRemovedNoBattery: { state: apc1-nocover }
          Broken: { state: apc-b }
          BrokenCoverRemovedBattery: { state: apc2-b-nocover }
          BrokenCoverRemovedNoBattery: { state: apc1-b-nocover }
          TerminalMissing: { state: apc0 }
          Maintenance: { state: apcmaint }
        enum.WiresVisualLayers.MaintenancePanel: # TODO RMC14
          Working: { visible: false }
          WiresExposed: { visible: false }
          CoverOpenBattery: { visible: false }
          CoverOpenNoBattery: { visible: false }
          CoverRemovedBattery: { visible: false }
          CoverRemovedNoBattery: { visible: false }
          Broken: { visible: false }
          BrokenCoverRemovedBattery: { visible: false }
          BrokenCoverRemovedNoBattery: { visible: false }
          TerminalMissing: { visible: false }
          Maintenance: { visible: false }
        enum.ApcVisualLayers.ChargeState: # TODO RMC14
          Working: { visible: true }
          WiresExposed: { visible: false }
          CoverOpenBattery: { visible: false }
          CoverOpenNoBattery: { visible: false }
          CoverRemovedBattery: { visible: false }
          CoverRemovedNoBattery: { visible: false }
          Broken: { visible: false }
          BrokenCoverRemovedBattery: { visible: false }
          BrokenCoverRemovedNoBattery: { visible: false }
          TerminalMissing: { visible: false }
          Maintenance: { visible: false }
        enum.ApcVisualLayers.InterfaceLock:
          Working: { visible: true }
          WiresExposed: { visible: false }
          CoverOpenBattery: { visible: false }
          CoverOpenNoBattery: { visible: false }
          CoverRemovedBattery: { visible: false }
          CoverRemovedNoBattery: { visible: false }
          Broken: { visible: false }
          BrokenCoverRemovedBattery: { visible: false }
          BrokenCoverRemovedNoBattery: { visible: false }
          TerminalMissing: { visible: false }
          Maintenance: { visible: false }
        enum.ApcVisualLayers.PanelLock:
          Working: { visible: true }
          WiresExposed: { visible: false }
          CoverOpenBattery: { visible: false }
          CoverOpenNoBattery: { visible: false }
          CoverRemovedBattery: { visible: false }
          CoverRemovedNoBattery: { visible: false }
          Broken: { visible: false }
          BrokenCoverRemovedBattery: { visible: false }
          BrokenCoverRemovedNoBattery: { visible: false }
          TerminalMissing: { visible: false }
          Maintenance: { visible: false }
        enum.ApcVisualLayers.Equipment:
          Working: { visible: true }
          WiresExposed: { visible: false }
          CoverOpenBattery: { visible: false }
          CoverOpenNoBattery: { visible: false }
          CoverRemovedBattery: { visible: false }
          CoverRemovedNoBattery: { visible: false }
          Broken: { visible: false }
          BrokenCoverRemovedBattery: { visible: false }
          BrokenCoverRemovedNoBattery: { visible: false }
          TerminalMissing: { visible: false }
          Maintenance: { visible: false }
        enum.ApcVisualLayers.Lighting:
          Working: { visible: true }
          WiresExposed: { visible: false }
          CoverOpenBattery: { visible: false }
          CoverOpenNoBattery: { visible: false }
          CoverRemovedBattery: { visible: false }
          CoverRemovedNoBattery: { visible: false }
          Broken: { visible: false }
          BrokenCoverRemovedBattery: { visible: false }
          BrokenCoverRemovedNoBattery: { visible: false }
          TerminalMissing: { visible: false }
          Maintenance: { visible: false }
        enum.ApcVisualLayers.Environment:
          Working: { visible: true }
          WiresExposed: { visible: false }
          CoverOpenBattery: { visible: false }
          CoverOpenNoBattery: { visible: false }
          CoverRemovedBattery: { visible: false }
          CoverRemovedNoBattery: { visible: false }
          Broken: { visible: false }
          BrokenCoverRemovedBattery: { visible: false }
          BrokenCoverRemovedNoBattery: { visible: false }
          TerminalMissing: { visible: false }
          Maintenance: { visible: false }
      enum.RMCApcVisualsLayers.Lock:
        enum.ApcVisualLayers.InterfaceLock:
          true: { state: apcox-1 }
          false: { state: apcox-0 }
      enum.RMCApcVisualsLayers.EquipmentChannel:
        enum.ApcVisualLayers.Equipment:
          ManualOff: { state: apco0-0 }
          AutoOff: { state: apco0-1 }
          ManualOn: { state: apco0-2 }
          AutoOn: { state: apco0-3 }
      enum.RMCApcVisualsLayers.LightingChannel:
        enum.ApcVisualLayers.Lighting:
          ManualOff: { state: apco1-0 }
          AutoOff: { state: apco1-1 }
          ManualOn: { state: apco1-2 }
          AutoOn: { state: apco1-3 }
      enum.RMCApcVisualsLayers.EnvironmentChannel:
        enum.ApcVisualLayers.Environment:
          ManualOff: { state: apco2-0 }
          AutoOff: { state: apco2-1 }
          ManualOn: { state: apco2-2 }
          AutoOn: { state: apco2-3 }
#        enum.ApcVisualLayers.PanelLock: # TODO RMC14
#          Working: { visible: false }
#          Broken: { visible: false }
#        enum.ApcVisualLayers.Equipment: # TODO RMC14
#          Working: { visible: false }
#          Broken: { visible: false }
#        enum.ApcVisualLayers.Lighting: # TODO RMC14
#          Working: { visible: false }
#          Broken: { visible: false }
#        enum.ApcVisualLayers.Environment: # TODO RMC14
#          Working: { visible: false }
#          Broken: { visible: false }
      enum.RMCApcVisualsLayers.Power:
        enum.ApcVisualLayers.ChargeState:
          NotCharging: { state: display-lack }
          Charging: { state: display-charging }
          FullCharge: { state: display-full }
  - type: RMCMesonsNonviewable

# APC under construction
- type: entity
  categories: [ HideSpawnMenu ]
  parent: APCFrame
  id: CMApcFrame
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Power/apc.rsi
    state: apc_frame
  - type: Icon
    sprite: _RMC14/Structures/Power/apc.rsi
    state: apc_frame
  - type: RMCApcConstructionFrame
  - type: SpriteSetRenderOrder
    offset: 0.45,-0.32
  - type: Construction
    graph: CMApc
    node: apcFrame
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CMSheetMetal1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  categories: [ HideSpawnMenu ]
  parent: CMApcFrame
  id: CMApcFrameWired
  name: wired APC frame
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Power/apc.rsi
    state: apcmaint
    scale: 1, 1
  - type: Construction
    graph: CMApc
    node: apcFrameWired

- type: entity
  categories: [ HideSpawnMenu ]
  parent: CMApcFrame
  id: CMApcFrameElectronics
  name: APC frame with electronics
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Power/apc.rsi
    state: apc1
    scale: 1, 1
  - type: Construction
    graph: CMApc
    node: apcFrameElectronics

# Constructed APC
- type: entity
  parent: CMApcBase
  id: CMApcConstructed
  suffix: Open
  components:
  - type: Icon
    sprite: _RMC14/Structures/Power/apc.rsi
    state: apc_frame
  - type: RMCApc
    cover: Open

- type: entity
  parent: CMApcBase
  id: CMApc
  suffix: Power
  components:
  - type: RMCApc
    startingCell: RMCPowerCellAPC

- type: entity
  parent: CMApcBase
  id: CMApcNoPower
  suffix: No Power
  components:
  - type: RMCApc
    startingCell: RMCPowerCellAPCNoPower

- type: entity
  parent: CMApcBase
  id: CMApcAlmayer
  suffix: Almayer
  components:
  - type: RMCApc
    startingCell: RMCPowerCellHigh
  - type: ContainerContainer
    containers:
      rmc_apc_power_cell: !type:ContainerSlot
  - type: SpriteSetRenderOrder
    offset: 0.45,-0.32

# APCs in use
- type: entity
  parent: CMApcBase
  id: CMApcLowCapacity
  suffix: APC, Small powercell, 50kW
  components: # TODO RMC14 / TODO RMC14 make apc use powercells
  - type: RMCApc
    startingCell: RMCPowerCellAPC
  - type: Battery
    maxCharge: 50000
    startingCharge: 50000

- type: entity
  parent: CMApcBase
  id: CMApcMediumCapacity
  suffix: APC, Medium powercell, 100kW
  components:
  - type: RMCApc
    startingCell: RMCPowerCellHigh
  - type: Battery
    maxCharge: 100000
    startingCharge: 100000

- type: entity
  parent: CMApcBase
  id: CMApcHighCapacity
  suffix: APC, High powercell, 150kW
  components:
  - type: RMCApc
    startingCell: RMCPowerCellSuper
  - type: Battery
    maxCharge: 150000
    startingCharge: 150000

