- type: entity
  id: RMCGeneratorFusionFake
  name: permanently destroyed S-52 fusion reactor
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - FullTileMask
        layer:
        - AirlockLayer
        - LowImpassable
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _RMC14/Structures/Power/fusion_reactor.rsi
    layers:
    - state: "off"
      map: [ "base" ]
  - type: Clickable

- type: entity
  parent: RMCGeneratorFusionFake
  id: RMCGeneratorFusion
  name: S-52 fusion reactor
  placement:
    mode: SnapgridCenter
  components:
  - type: GuideHelp
    guides:
    - RMCGuidePower
    - RMCGuideRoleCombatTechnician
  - type: InteractionOutline
  - type: Appearance
  - type: Corrodible
    isCorrodible: false
  - type: RMCFusionReactor
    watts: 50000
  - type: RMCPowerSource
  - type: ActivatableUIBlacklist
    blacklist:
      components:
      - Xeno
  - type: GenericVisualizer
    visuals:
      enum.RMCFusionReactorLayers.Layer:
        base:
          Off: { state: "off" }
          Weld: { state: "weld" }
          Wire: { state: "wire" }
          Wrench: { state: "wrench" }
          Ten: { state: "on-10" }
          TwentyFive: { state: "on-25" }
          Fifty: { state: "on-50" }
          SeventyFive: { state: "on-75" }
          Hundred: { state: "on-100" }
          Overloaded: { state: "overloaded" }
          Empty: { state: "cell_missing" }
  - type: BlockXenoConstruction
  - type: RMCMesonsNonviewable

- type: entity
  parent: RMCGeneratorFusion
  id: RMCGeneratorFusionColony
  name: G-11 geothermal generator
  description: A thermoelectric generator sitting atop a plasma-filled borehole.
  components:
  - type: RMCFusionReactor
    watts: 100000
    randomizeDamage: true
    enabled: false
    baseFailureChance: 10
    failureChance: 10
  - type: IntelPowerObjective
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _RMC14/Structures/Power/geothermal_generator.rsi
  - type: GenericVisualizer
    visuals:
      enum.RMCFusionReactorLayers.Layer:
        base:
          Off: { state: "off" }
          Weld: { state: "weld" }
          Wire: { state: "wire" }
          Wrench: { state: "wrench" }
          Ten: { state: "on-10" }
          TwentyFive: { state: "on-25" }
          Fifty: { state: "on-50" }
          SeventyFive: { state: "on-75" }
          Hundred: { state: "on-100" }
          Empty: { state: "cell_missing" }
  - type: MarineMapTracked
  - type: XenoMapTracked
  - type: TacticalMapTracked
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: generator

- type: entity
  parent: RMCGeneratorFusionColony
  id: RMCGeneratorFusionColonyNoMapIcon
  suffix: No Map Icon
  components:
  - type: RemoveComponents
    components:
    - type: MarineMapTracked
    - type: XenoMapTracked
    - type: TacticalMapTracked
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: generator

- type: entity
  parent: BaseItem
  id: RMCGeneratorFusionCell
  name: WL-6 universal fuel cell
  description: A rechargeable fuel cell.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Power/fusion_fuel_cell.rsi
    layers:
    - state: cell-full
      map: [ "base" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.RMCFusionCellVisuals.Fuel:
        base:
          Empty: { state: cell-empty }
          Low: { state: cell-low }
          Medium: { state: cell-medium }
          High: { state: cell-high }
          Full: { state: cell-full }
  - type: Item
    size: Normal
  - type: GuideHelp
    guides:
    - RMCGuidePower
  - type: RMCFusionCell

- type: entity
  parent: RMCGeneratorFusionCell
  id: RMCGeneratorFusionCellEmpty
  suffix: Empty
  components:
  - type: RMCFusionCell
    fuel: 0
    isFresh: false

- type: entity
  abstract: true
  id: RMCPortableGeneratorBase # TODO RMC14 - Functionality
  parent: [ BaseMachine, SmallConstructibleMachine, StructureWheeled]
  components:
    - type: GuideHelp
      guides:
      - RMCGuideRoleCombatTechnician
    - type: Transform
      anchored: False
    - type: Physics
      bodyType: Dynamic
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.40,-0.40,0.40,0.40"
          density: 155
          mask:
            - MachineMask
          layer:
            - MachineLayer
    - type: Appearance
    - type: Sprite
      sprite: _RMC14/Structures/Power/generators.rsi
      noRot: true
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 200
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
        - trigger:
            !type:DamageTrigger
            damage: 100
          behaviors:
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
            - !type:ChangeConstructionNodeBehavior
              node: machineFrame
            - !type:DoActsBehavior
              acts: ["Destruction"]

- type: entity
  parent: RMCPortableGeneratorBase
  id: RMCPortableGenerator
  name: "P.A.C.M.A.N.-type Portable Generator"
  description: A portable generator for emergency backup power.
  components:
    - type: Sprite
      state: portgen0
    - type: Machine
      board: RMCPortableGeneratorPacmanMachineCircuitBoard

- type: entity
  parent: RMCPortableGeneratorBase
  id: RMCPortableGenerator2
  name: "S.U.P.E.R.P.A.C.M.A.N.-type Portable Generator"
  description: A portable generator for emergency backup power.
  components:
    - type: Sprite
      state: portgen1
    - type: Machine
      board: RMCPortableGeneratorSuperPacmanMachineCircuitboard

- type: entity
  parent: BaseMachine
  id: RMCFusionFuelRecycler
  name: fusion fuel recycler
  description: Reconditions depleted WL-6 fusion fuel cells. It can process two cells at once.
  placement:
    mode: SnapgridCenter
  components:
  - type: RemoveComponents
    components:
    - type: Damageable
    - type: Destructible
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Structures/Power/fusion_reactor.rsi
    layers:
    - state: recycler
      map: [ "base" ]
    - state: overlay_left_cell
      map: [ "leftCell" ]
      visible: false
    - state: overlay_right_cell
      map: [ "rightCell" ]
      visible: false
    - state: overlay_left_charging
      map: [ "leftCharging" ]
      visible: false
    - state: overlay_right_charging
      map: [ "rightCharging" ]
      visible: false
    - state: overlay_left_charged
      map: [ "leftCharged" ]
      visible: false
    - state: overlay_right_charged
      map: [ "rightCharged" ]
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.RMCFusionFuelRecyclerVisuals.Working:
        base:
          True: { state: recycler_on }
          False: { state: recycler }
      enum.RMCFusionFuelRecyclerVisuals.LeftCell:
        leftCell:
          True: { visible: true }
          False: { visible: false }
      enum.RMCFusionFuelRecyclerVisuals.RightCell:
        rightCell:
          True: { visible: true }
          False: { visible: false }
      enum.RMCFusionFuelRecyclerVisuals.LeftCharging:
        leftCharging:
          True: { visible: true }
          False: { visible: false }
      enum.RMCFusionFuelRecyclerVisuals.RightCharging:
        rightCharging:
          True: { visible: true }
          False: { visible: false }
      enum.RMCFusionFuelRecyclerVisuals.LeftCharged:
        leftCharged:
          True: { visible: true }
          False: { visible: false }
      enum.RMCFusionFuelRecyclerVisuals.RightCharged:
        rightCharged:
          True: { visible: true }
          False: { visible: false }
  - type: RMCFusionFuelRecycler
  - type: ContainerContainer
    containers:
      rmc_fusion_recycler_left: !type:ContainerSlot
      rmc_fusion_recycler_right: !type:ContainerSlot
  - type: ApcPowerReceiver
  - type: RMCPowerReceiver
    idleLoad: 0
    activeLoad: 15000
    channel: Equipment
  - type: Corrodible
    isCorrodible: false
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: BlockXenoConstruction
  - type: GuideHelp
    guides:
    - RMCGuidePower

- type: entity
  parent: RMCFusionFuelRecycler
  id: RMCFusionFuelRecyclerFilled
  suffix: Filled
  components:
  - type: ContainerFill
    containers:
      rmc_fusion_recycler_left:
      - RMCGeneratorFusionCell
      rmc_fusion_recycler_right:
      - RMCGeneratorFusionCell
