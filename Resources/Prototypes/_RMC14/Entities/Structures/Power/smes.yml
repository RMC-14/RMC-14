# Base SMES
- type: entity
  abstract: true
  parent: [ BaseMachine, ConstructibleMachine ]
  id: CMSMESBase
  name: SMES
  description: A high-capacity superconducting magnetic energy storage (SMES) unit.
  components:
    - type: AmbientSound
      volume: -7
      range: 3
      sound:
        path: /Audio/Ambience/Objects/periodic_beep.ogg
    - type: GuideHelp
      guides:
      - RMCGuidePower
      - RMCGuideRoleCombatTechnician
    - type: Sprite
      sprite: _RMC14/Structures/Power/smes.rsi
      layers:
      - state: smes
      - map: ["enum.SmesVisualLayers.Charge"]
        state: "smes-og1" # -og0 does not exist
        shader: unshaded
        visible: false
      - map: ["enum.SmesVisualLayers.Input"]
        state: "smes-oc0"
        shader: unshaded
      - map: ["enum.SmesVisualLayers.Output"]
        state: "smes-op1"
        shader: unshaded
      - map: ["enum.WiresVisualLayers.MaintenancePanel"]
        sprite: Structures/Power/smes.rsi
        state: smes-open
    - type: Smes
    - type: Appearance
    - type: Battery
      maxCharge: 200000000
      startingCharge: 0
    - type: ExaminableBattery
    - type: PointLight
      radius: 1.5
      energy: 1.6
      color: "#c9c042"
      castShadows: false
    - type: WiresPanel
    - type: WiresVisuals
    - type: Machine
      board: CMSMESMachineCircuitboard
    - type: RMCPowerStorage
      inputEnabled: false
      inputLimit: 200000
      maxInput: 200000
      outputEnabled: true
      outputLimit: 50000
      maxOutput: 200000
    - type: RMCSmes
    - type: UserInterface
      interfaces:
        enum.RMCSmesUiKey.Key:
          type: RMCSmesBui
    - type: ActivatableUI
      key: enum.RMCSmesUiKey.Key
    - type: InteractedBlacklist
      blacklist:
        components:
        - Xeno


# SMES' in use

- type: entity
  parent: CMSMESBase
  id: CMSMESBasic
  suffix: Basic, 200 MJ
  components:
  - type: Battery
    maxCharge: 200000000
    startingCharge: 200000000

- type: entity
  parent: CMSMESBasic
  id: CMSMESEmpty
  suffix: Empty
  components:
  - type: Battery
    startingCharge: 0
