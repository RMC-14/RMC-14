## Varadero props
# they intentionally do not have collision

# railcannon
- type: entity
  id: RMCPropVaraderoCannon
  name: M2168A2 200-inch Celestial Defense Cold Launch Railgun
  description: A large super heavy 200-inch cold launch railgun designed for protection of strategic points of interest from hostile orbital inclusion. Operated via a fire-control system console deck nearby. Fires HIM-85 Multi-Stage Anti-Aerospace Missiles.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    noRot: true
  - type: Physics
    fixedRotation: true
    canCollide: False
  - type: Sprite
    drawdepth: Mobs
    sprite: _RMC14/Structures/varadero_cannon.rsi
    state: cannon
  - type: Clickable
  - type: InteractionOutline
  - type: Corrodible
    isCorrodible: false

- type: entity
  parent: RMCPropVaraderoCannon
  id: RMCPropVaraderoCannon1
  name: M2168A2 200-inch Celestial Defense Cold Launch Railgun Cannon
  description: The actual barrel of a large super heavy 200-inch cold launch railgun designed for protection of strategic points of interest from hostile orbital inclusion. Operated via a fire-control system console deck nearby. Fires HIM-85 Multi-Stage Anti-Aerospace Missiles.
  suffix: Barrel
  components:
  - type: Sprite
    drawdepth: Mobs
    state: cannon1

