- type: entity
  parent: BaseItem
  id: RMCArmorPlateBase
  abstract: true
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: _RMC14/Objects/Armor/Plates/research_plate.rsi
    state: plate_research

- type: entity
  parent: RMCArmorPlateBase
  id: RMCArmorPlateCoagulator
  name: experimental blood coagulator
  description: A device that encourages clotting through the coordinated effort of multiple sensors and radiation emitters. The Surgeon General warns that continuous exposure to radiation may be hazardous to your health.
  components:
  - type: RMCArmorPlate
    wearerComponents:
    - type: RMCCoagulatorPlateActive
      cancelChance: 100

- type: entity
  parent: RMCArmorPlateBase
  id: RMCArmorPlateEmergencyInjector
  name: emergency chemical plate
  description: One-time disposable research plate packing all kinds of chemicals injected at the will of the user by pressing two buttons on the sides simultaneously. The injection is painless, instant and packs much more chemicals than your normal emergency injector. Features OD Protection in three modes.
  components:
  - type: RMCArmorPlate
    wearerComponents:
    - type: RMCEmergencyInjectorPlateActive
  - type: RMCEmergencyInjectorPlate

- type: entity
  parent: RMCArmorPlateBase
  id: RMCArmorPlateCeramic
  name: ceramic plate
  description: A strong trauma plate, able to protect the user from a large amount of bullets. Ineffective against sharp objects.
  components:
  - type: RMCArmorPlate
    wearerComponents:
    - type: RMCCeramicPlateActive
  - type: RMCCeramicPlate
  - type: Sprite
    sprite: _RMC14/Objects/Armor/Plates/ceramic_plate.rsi
    layers:
    - state: ceramic2_100
      map: [ "plate" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.RMCCeramicPlateVisuals.State:
        plate:
          Full: { state: ceramic2_100 }
          Damaged: { state: ceramic2_50 }
          Broken: { state: ceramic2_0 }

- type: entity
  parent: RMCArmorPlateBase
  id: RMCArmorPlateAntiDecay
  name: experimental preservation plate
  description: Preservation plate which activates once the user is dead, uses variety of different substances and sensors to slow down the decay and increase the time before the user is permanently dead to around 9 minutes instead of 5.
  components:
  - type: RMCArmorPlate
    wearerComponents:
    - type: RMCAntiDecayPlateActive

- type: entity
  parent: RMCArmorPlateBase
  id: RMCArmorPlateTranslator
  name: experimental language translator
  description: Translates any language heard by the microphones on the plate without any linguistical input, allowing to translate languages never heard before and known languages alike.
  components:
  - type: RMCArmorPlate
    wearerComponents:
    - type: RMCTranslatorPlateActive
