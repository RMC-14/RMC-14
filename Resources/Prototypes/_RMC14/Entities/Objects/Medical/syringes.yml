- type: entity
  parent: Syringe
  id: CMSyringeNoMelee
  suffix: RMC14
  abstract: true
  components:
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    fillBaseName: syringe
  - type: Sprite
    sprite: _RMC14/Objects/Medical/syringe.rsi
    layers:
    - state: syringe
      map: [ "enum.SolutionContainerLayers.Base" ]
    - state: syringe1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: Icon
    sprite: _RMC14/Objects/Medical/syringe.rsi
    state: "syringe"
  - type: Item
    storedRotation: 90
    size: Tiny
    sprite: _RMC14/Objects/Medical/syringe.rsi
  - type: Clothing
    quickEquip: false
    slots:
    - suitstorage
  - type: PhysicalComposition
    materialComposition:
      CMGlass: 150
  - type: RequiresSkill
    skills:
      RMCSkillMedical: 2
  - type: Injector
    delay: 2
    delayPerVolume: 0
  - type: RMCSyringe
    injectDamage:
      types:
        Piercing: 3

- type: entity
  parent: CMSyringeNoMelee
  id: CMSyringe
  suffix: RMC14
  components:
  - type: MeleeWeapon
    angle: 0
    wideAnimationRotation: 270
    damage:
      types:
        Blunt: 0
    animation: RMCWeaponArcSyringe

- type: entity
  parent: CMSyringe
  id: RMCPrefilledSyringe
  suffix: RMC14, Inject
  components:
  - type: Injector
    toggleState: Inject

- type: entity
  parent: CMSyringeNoMelee
  id: RMCSyringeLethal
  name: lethal injection syringe
  description: A syringe used for lethal injections.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medical/lethal_syringe.rsi
  - type: SolutionContainerManager
    solutions:
      injector:
        maxVol: 50
  - type: Injector
    minTransferAmount: 50
    maxTransferAmount: 50
    transferAmount: 50
    delay: 30
    delayPerVolume: 0
  - type: RMCSyringe
    allowInstantSelfInject: false
    allowInstantDraw: false
    allowBloodDraw: false
    skillBasedDelay: false

- type: entity
  parent: RMCSyringeLethal
  id: RMCSyringeLethalPrefilled
  suffix: RMC14, Filled
  components:
  - type: Label
    currentLabel: reagent-name-rmc-chloral-hydrate
  - type: Injector
    toggleState: Inject
  - type: SolutionContainerManager
    solutions:
      injector:
        maxVol: 50
        reagents:
        - ReagentId: RMCChloralhydrate
          Quantity: 50

- type: entity
  parent: BaseItem
  id: RMCSyringeBroken
  name: syringe
  description: A syringe. It's broken.
  suffix: RMC14, Broken
  components:
  - type: Item
    size: Tiny
    sprite: _RMC14/Objects/Medical/syringe.rsi
    storedRotation: 90
  - type: Sprite
    sprite: _RMC14/Objects/Medical/syringe.rsi
    state: broken
  - type: PhysicalComposition
    materialComposition:
      CMGlass: 150
  - type: Clothing
    quickEquip: false
    slots:
    - suitstorage
  - type: Tag
    tags:
    - Trash
