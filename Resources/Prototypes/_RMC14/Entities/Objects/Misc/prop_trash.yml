- type: entity
  parent: BaseItem
  id: RMCPropTrashFull
  name: full trash bag
  description: It's the heavy-duty black polymer kind. It's full of old trash, you don't want to touch it.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/prop_trash.rsi
    state: ztrashbag

- type: entity
  parent: RMCPropTrashFull
  id: RMCPropBananaPeel
  suffix: RMC
  name: banana peel
  description: A peel from a banana.
  components:
  - type: Sprite
    state: banana_peel

- type: entity
  parent: RMCPropTrashFull
  id: RMCPropCuppaJoeLid
  name: The Daily Grind coffee cup lid
  description: A lid from a disposable coffee cup. It's made of plastic and has a small hole for sipping.
  components:
  - type: Sprite
    state: coffeecuppajoelid

- type: entity
  parent: RMCPropTrashFull
  id: RMCPropCuppaJoeNoLid
  name: empty The Daily Grind coffee cup
  description: An empty disposable coffee cup from The Daily Grind. It has a small hole at the bottom, so it's not very useful for holding liquids anymore.
  components:
  - type: Sprite
    state: coffeecuppajoenolid

- type: entity
  parent: RMCPropTrashFull
  id: RMCPropCuppaJoeNoLidStack
  name: empty The Daily Grind cup stack
  description: A stack of empty disposable coffee cups from The Daily Grind.
  components:
  - type: Sprite
    state: coffeecuppajoestacknolid

- type: entity
  parent: RMCPropTrashFull
  id: RMCPropCuppaJoeLidStack
  name: The Daily Grind coffee cup lid stack
  description: A stack of coffee cup lids from The Daily Grind.
  components:
  - type: Sprite
    state: coffeecuppajoelidstack

- type: entity
  parent: RMCPropTrashFull
  id: RMCPropPlate
  name: plate
  suffix: RMC
  description: This is rubbish.
  components:
  - type: Sprite
    state: plate

- type: entity
  parent: RMCPropPlate
  id: RMCPropPlateCeramic
  name: ceramic plate
  description: A ceramic plate, it doesn't seem like it's done its patriotic duty of being a stand for food yet. Now that you look at it, this might make a good throwing weapon...
  components:
  - type: Sprite
    state: ceramic_plate
  - type: DamageOnLand
    damage:
      types:
        Blunt: 5
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 5
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -8
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: RMCPropPlate
  id: RMCPropTrashTray
  name: tray
  description: A metal tray to lay food on.
  components:
  - type: Sprite
    state: tray
  - type: DamageOnLand
    damage:
      types:
        Blunt: 12
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 10
