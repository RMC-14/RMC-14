- type: entity
  parent: BaseItem
  id: RMCExplosiveBreachingCharge
  name: breaching charge # TODO RMC14 disable with multitool?
  description: An explosive device used to break into areas while protecting the user from the blast as well as deploying deadly shrapnel on the other side.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Explosives/satchel_charge.rsi
    state: icon
    noRot: true
    layers:
    - state: icon
      map: ["base"]
  - type: Item
    size: Small
  - type: Sticky
    stickDelay: 1
    canUnstick: false
    stickPopupStart: comp-sticky-start-stick-bomb
    stickPopupSuccess: comp-sticky-success-stick-bomb
    unstickPopupStart: comp-sticky-start-unstick-bomb
    unstickPopupSuccess: comp-sticky-success-unstick-bomb
    whitelist:
      components:
      - RMCWallExplosionDeletable
  - type: Explosive
    explosionType: RMC
    totalIntensity: 6
    intensitySlope: 6
    maxIntensity: 6
    maxTileBreak: 1
    canCreateVacuum: false
  - type: RMCBreachingCharge
  - type: ProjectileGrenade
    fillPrototype: RMCBreachingChargeShrapnel
    capacity: 40
    spreadAngle: 110
    minVelocity: 0
    maxVelocity: 0
    projectileSpeed: 20
    projectileSpeedVariance: 0.15
    minProjectileDamageMultiplier: 1.06
    maxProjectileDamageMultiplier: 1.13
    spawnOffset: 1
    tileAlignedSpawnOffset: true
    directHit: true
    directHitChance: 0.15
    triggerUserIsShooter: true
  - type: ClusterLimitHits
    limit: 0
    ignoreFirstHit: true
  - type: StickyVisualizer
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.Trigger.TriggerVisuals.VisualState:
        base:
          Primed: { state: active }
          Unprimed: { state: icon }
  - type: RMCExplosiveDelete
  - type: Tag
    tags:
    - RMCExplosiveBreachingCharge
  - type: RequiresSkill
    skills:
      RMCSkillEngineer: 1

- type: entity
  parent: RMCExplosiveBreachingCharge
  id: RMCExplosiveBreachingChargeRubber
  name: X17 riot charge
  description: An explosive device used to break into areas while protecting the user from the blast. Unlike the standard breaching charge, the X17 deploys a cone spray of rubber pellets to incapacitate rather than kill.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Explosives/satchel_charge_rubber.rsi
    state: icon
    layers:
    - state: icon
      map: ["base"]
  - type: ProjectileGrenade
    fillPrototype: RMCBreachingChargeRubberPellet
    capacity: 20
    projectileSpeed: 20
    minProjectileDamageMultiplier: 1
    maxProjectileDamageMultiplier: 1
  - type: RequiresSkill
    skills:
      RMCSkillPolice: 1

# TSEPA variant
- type: entity
  parent: RMCExplosiveBreachingChargeRubber
  id: RMCExplosiveBreachingChargeRubberTSEPA
  name: TSEPA X17 riot charge
  components:
  - type: RequiresSkill
    skills:
      RMCSkillPolice: 0
      RMCSkillEngineer: 1

- type: entity
  parent: RMCExplosiveBreachingCharge
  id: RMCExplosivePlastic
  name: plastic explosives
  description: Used to put holes in specific areas without too much extra hole.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Explosives/plastic_explosives.rsi
    noRot: false
  - type: Explosive
    totalIntensity: 350
    intensitySlope: 6
    maxIntensity: 20
    maxTileBreak: 2147483647
  - type: ExplodeOnTrigger
  - type: RemoveComponents
    components:
    - type: RMCBreachingCharge
    - type: ProjectileGrenade
    - type: ClusterLimitHits
  - type: Sticky
    stickDelay: 5
    whitelist:
      components:
      - RMCWallExplosionDeletable
      - XenoTunnel
  - type: RMCExplosiveDelete
    delay: 10
    beepSound:
      path: "/Audio/Effects/beep1.ogg"
      params:
        volume: 4
    initialBeepDelay: 0
    beepInterval: 0.5
    whitelist:
      components:
      - XenoTunnel

- type: Tag
  id: RMCExplosiveBreachingCharge
