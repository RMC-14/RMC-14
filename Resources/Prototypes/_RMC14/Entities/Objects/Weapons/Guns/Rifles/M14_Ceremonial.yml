- type: entity
  parent: [ CMBaseWeaponRifle, RMCBaseWeaponMagazineVisuals ]
  name: M14 Ceremonial Rifle
  id: WeaponRifleM14Ceremonial
  description: The M14 Ceremonial Rifle is a modernized adaptation of a century old weapon, modified predominantly for the use during ceremonial traditions pre-dating most of those alive today. Not advised for use in combat.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Rifles/m14ceremonial.rsi
    layers:
    - state: bolt-open
      map: [ "enum.GunVisualLayers.Base" ]
    - sprite: _RMC14/Objects/Weapons/Guns/Attachments/barrel.rsi
      state: m14ceremonial_barrel
      offset: 1, 0
      map: [ "barrel" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Rifles/m14ceremonial.rsi
  - type: Gun
    shotsPerBurst: 0
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_m4spr.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    recoilUnwielded: 2
    scatterWielded: 6
    baseFireRate: 2.86
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.25
    accuracyMultiplierUnwielded: 0.6
  - type: RMCWeaponDamageFalloff
    falloffMultiplier: 0
  - type: WieldDelay
    baseDelay: 0.2
  - type: WieldableSpeedModifiers
    base: 0.725
    light: 1
    medium: 1
    heavy: 1
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/l42_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/l42_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazineRifleM14Ceremonial
  - type: GunDamageModifier
    multiplier: 1.2
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCM5Bayonet
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 1.00, 0.04
  - type: RMCAirShot
    preparationTime: 1.5
    requiresCombat: true
    doAfterBreakOnMove: false
    ignoreRoof: true
    shakeAmount: 1
  - type: Tag
    tags:
    - RMCWeaponRifleM14Ceremonial

- type: entity
  parent: RMCBaseBullet
  id: BulletRifleBlank10x24mm
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 5
  - type: RMCProjectileDamageFalloff
    thresholds:
    - range: 2
      falloff: 9999
      ignoreModifiers: true
    - range: 1
      falloff: 4
  - type: RMCProjectileAccuracy
    accuracy: 105
    thresholds:
    - range: 3
      falloff: 10

- type: entity
  parent: CMBaseCartridgeRifle
  id: RMCCartridgeRifleBlank10x24mm
  name: blank cartridge (10x24mm)
  description: A Blank 10x24mm cartridge. Fits in Blank 10x24mm magazines.
  components:
  - type: Tag
    tags:
    - Cartridge
    - RMCCartridgeRifleBlank10x24mm
  - type: CartridgeAmmo
    proto: BulletRifleBlank10x24mm

- type: entity
  parent: CMMagazineRifleBase
  id: RMCMagazineRifleM14Ceremonial
  name: "M14 Blank magazine (10x24mm)"
  description: "A magazine of blank 10x24mm rounds for use in the M14 Ceremonial rifle."
  components:
  - type: Tag
    tags:
    - CMMagazineRifle
    - RMCMagazineRifleM14Ceremonial
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - RMCCartridgeRifleBlank10x24mm
    proto: RMCCartridgeRifleBlank10x24mm
    capacity: 14
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/m14ceremonial.rsi
  - type: RefillableByBulletBox
    bulletType: RMCBoxBulletsRifle

- type: entity
  parent: RMCKitBase
  id: RMCKitRifleM14Ceremonial
  name: M14 Ceremonial Rifle Kit
  description: Contains a M14 Ceremonial Rifle and 5 blank ammunition magazines
  components:
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,9,1
  - type: StorageFill
    contents:
    - id: WeaponRifleM14Ceremonial
    - id: RMCMagazineRifleM14Ceremonial
      amount: 5


- type: Tag
  id: RMCCartridgeRifleBlank10x24mm

- type: Tag
  id: RMCMagazineRifleM14Ceremonial

- type: Tag
  id: RMCWeaponRifleM14Ceremonial
