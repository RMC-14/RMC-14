- type: entity
  parent: [ CMBaseWeaponRifle, RMCBaseWeaponMagazineVisuals ]
  id: RMCWeaponRifleF78
  name: F78 rifle
  description: The Fusil Modele 78, an odd-looking bullpup design rarely seen in use by colony militias and in the hands of collectors. Chambered in 5.56x45mm and accepts UNSTAC magazines.
  suffix: Filled
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Rifles/f78.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
  - type: ItemMapper
    mapLayers:
      mag-0:
        whitelist:
          tags:
            - RMCMagazineRifleCR16
      mag-1:
        whitelist:
          tags:
            - RMCMagazineRifleCR16Ext
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Rifles/f78.rsi
  - type: Gun
    selectedMode: Burst
    burstCooldown: 0.5
    availableModes:
    - SemiAuto
    - Burst
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_cr16.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    recoilUnwielded: 3
    scatterWielded: 5
    scatterUnwielded: 20
    baseFireRate: 4
    burstScatterMult: 2
    modifiers:
      Burst:
        fireDelay: 0.01
        maxScatterModifier: 10
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 6
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.2
    accuracyMultiplierUnwielded: 0.8
  - type: MagazineAmmoProvider
    autoEject: false
    soundAutoEject: null
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: RMCMagazineRifleCR16
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_m16_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_m16_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazineRifleCR16
          - RMCMagazineRifleCR16Ext
  - type: GunDamageModifier
    multiplier: 1.3
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentBarrelCharger
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentExtendedCompensator
          - RMCAttachmentRecoilCompensator
          - RMCAttachmentSuppressor
          - RMCM5Bayonet
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
          - RMCAttachmentS84xTelescopicScope
          - RMCAttachmentS42xTelescopicMiniscope
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentAngledGrip
          - RMCAttachmentVerticalGrip
          - RMCAttachmentFlashlightGrip
          - RMCAttachmentGyroscopicStabilizer
          - RMCAttachmentLaserSight
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.9, 0.032
      rmc-aslot-rail: 0.065, 0.19
      rmc-aslot-underbarrel: 0.375, -0.28
