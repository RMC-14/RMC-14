- type: entity
  parent: RMCWeaponRifleE290A1
  id: RMCWeaponRifleE290A1D
  name: E290A1/D marksman rifle # in CM13 the F903A1 Marksman Rifle
  description: A variation of the E290A1 a rare DMR configuration currently being phased out. These days its typically only issued to TSE forces not expecting stable supply lines, such as the paramarines. Uses 10x24mm caseless ammunition. # This weapon only accepts the smaller 20 round magazines of 10x24mm. till issue is resolved in parity
  suffix: Filled
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Rifles/e290/dmr.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
  - type: ItemMapper
    mapLayers:
      mag-0:
        whitelist:
          tags:
          - RMCMagazineRifleE290 # gun is coded poorly in parity. Parity desc claims it doesnt take regular magazines but doesnt actually prevent other magazine type use due to parenting.
          - RMCMagazineRifleE290Marksman
          - RMCMagazineRifleE290HEAP # for issue stated above, not setting up HEAP marksman. Functions purely as a direct downgrade due to poor code and is admeme item only
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Rifles/e290/dmr.rsi
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
  - type: RMCWeaponDamageFalloff
    falloffMultiplier: 0
  - type: GunDamageModifier
    multiplier: 1.6
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: RMCMagazineRifleE290Marksman
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazineRifleE290
          - RMCMagazineRifleE290Marksman
          - RMCMagazineRifleE290HEAP
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentBarrelCharger
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentSuppressor
          - RMCM5Bayonet
          - RMCAttachmentRecoilCompensator
          - RMCAttachmentExtendedCompensator
      rmc-aslot-rail:
        locked: true
        startingAttachable: RMCAttachmente290Scope
        whitelist:
          tags:
          - RMCAttachmente290Scope
      rmc-aslot-underbarrel:
        locked: true
        startingAttachable: RMCAttachmentE290Grip
        whitelist:
          tags:
          - RMCAttachmentE290Grip
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.84, 0
      rmc-aslot-rail: -0.065, 0.185
      rmc-aslot-underbarrel: 0.09, 0
  - type: Tag
    tags:
    - RMCRiflee290
    - RMCRiflee290A1D

# Magazines

- type: entity
  parent: CMMagazineRifleBase
  id: RMCMagazineRifleE290
  name: E290 magazine (10x24mm)
  description: "A magazine of 10x24mm rounds for use in E290 rifles."
  components:
  - type: Tag
    tags:
    - CMMagazineRifle
    - RMCMagazineRifleE290
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - CMCartridgeRifle10x24mm
    proto: CMCartridgeRifle10x24mm
    capacity: 30
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/e290.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Appearance
  - type: RefillableByBulletBox
    bulletType: RMCBoxBulletsRifle

- type: entity
  parent: RMCMagazineRifleE290
