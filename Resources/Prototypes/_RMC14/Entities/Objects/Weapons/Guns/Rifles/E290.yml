- type: entity
  parent: [ CMBaseWeaponRifle, RMCBaseWeaponMagazineVisuals ]
  id: RMCWeaponRifleE290A1
  name: E290A1 rifle # in CM13 the F903A1
  description: The E290A1 is the oldest rifle of the TSE still in active service. It's the last of the TSE's older 'E' designation, and these days it's typically only issued to TSE reservists and/or forces not expecting stable supply lines, such as the Paramarines. Uses 10x24mm caseless ammunition.
  suffix: Filled
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Rifles/e290/e290A1.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
  - type: ItemMapper
    mapLayers:
      mag-0:
        whitelist:
          tags:
          - RMCMagazineRifleE290
          - RMCMagazineRifleE290HEAP
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Rifles/e290/e290A1.rsi
    slots:
    - suitStorage
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    - Burst
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_l88.ogg
      params:
        volume: -2
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    recoilWielded: 4
    recoilUnwielded: 4
    scatterWielded: 3
    scatterUnwielded: 10
    baseFireRate: 4.0
    burstScatterMult: 1
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.3
    accuracyMultiplierUnwielded: 0.65
  - type: GunClickToFire # Has burst fire, no need for semi auto = full auto
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: RMCMagazineRifleE290
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazineRifleE290
          - RMCMagazineRifleE290HEAP
  - type: GunDamageModifier
    multiplier: 1.1
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentBarrelCharger
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentSuppressor
          - RMCM5Bayonet
          - RMCAttachmentRecoilCompensator
          - RMCAttachmentExtendedCompensator
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.84, 0
      rmc-aslot-rail: 0.06, 0.12
      rmc-aslot-underbarrel: 0, 0
  - type: Tag
    tags:
    - RMCRifleE290
    - RMCRifleE290A1

- type: entity
  parent: RMCWeaponRifleE290A1
  id: RMCWeaponRifleE290A2
  name: E290A2 rifle # in CM13 the F903A2
  description: A non-standard issue rifle of the royal crown marines and comes with an intergrated foregrip. The E290 is the last of the TSE's old 'E' designation, and these days its typically only issued to TSE reservists and/or forces not expecting stable supply lines, such as the Paramarines. Uses 10x24mm caseless ammunition.
  suffix: Filled
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Rifles/e290/comm.rsi
    layers:
    - state: base
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentSuppressor
          - RMCAttachmentExtendedCompensator
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
      rmc-aslot-underbarrel:
        locked: true
        startingAttachable: RMCAttachmentE290Grip
        whitelist:
          tags:
          - RMCAttachmentE290Grip
  - type: Tag
    tags:
    - RMCRifleE290
    - RMCRifleE290A2

