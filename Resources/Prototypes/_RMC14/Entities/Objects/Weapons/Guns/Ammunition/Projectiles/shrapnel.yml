- type: entity
  parent: RMCBaseBullet
  id: CMProjectileShrapnel
  name: shrapnel
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Projectiles/shotgun_projectiles.rsi
    layers:
    - state: buckshot
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.1,0.1,0.1"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
        - LowImpassable
        - BarricadeImpassable
      fly-by:
        shape: !type:PhysShapeCircle
          radius: 1.5
        layer:
        - Impassable
        - MidImpassable
        - HighImpassable
        - LowImpassable
        hard: False
  - type: Projectile
    damage:
      types:
        Piercing: 25
    deleteOnCollide: true
  - type: CMArmorPiercing
    amount: 20
  - type: RMCProjectileAccuracy
    accuracy: 100
    thresholds:
    - range: 32
      falloff: 10

- type: entity
  parent: CMProjectileShrapnel
  id: RMCBreachingChargeShrapnel
  name: breaching charge shrapnel
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 30
    deleteOnCollide: true
  - type: ProjectileMaxRange
    max: 8
  - type: RMCProjectileAccuracy
    accuracy: 125

- type: entity
  parent: CMProjectileShrapnel
  id: RMCMortarShellFragShrapnel
  name: fragmentation mortar shell shrapnel
  categories: [ HideSpawnMenu ]
  components:
  - type: ProjectileMaxRange
    max: 8
  - type: DamageMultipliers
    multipliers:
      Turf: 5
      Breaching: 10.8
      Pylon: 5

- type: entity
  parent: CMProjectileShrapnel
  id: RMCBreachingChargeRubberPellet
  name: breaching charge rubber pellet
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage: {}
    deleteOnCollide: true
  - type: RMCStaminaDamageOnCollide
    damage: 25
  - type: CMArmorPiercing
    amount: 0
  - type: ProjectileMaxRange
    max: 8
