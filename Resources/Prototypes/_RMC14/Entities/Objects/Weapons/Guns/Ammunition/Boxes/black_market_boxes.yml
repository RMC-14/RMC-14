# Ammo boxes required by the black market catalog.
- type: entity
  parent: RMCBoxMagazineRifleBase
  id: RMCBox4570Empty
  name: bullet bundle box (45-70 x 300)
  description: A box filled with handfuls of 45-70 Govt. rounds, for the old-timers.
  components:
  - type: Sprite
    layers:
    - state: rifle_box
      color: "#62757b"
    - state: rifle_box_458
      color: "#ffcb26"
    - state: rifle_box_marking
      color: "#7c4c1b"
    - state: rifle_ammo_full_rounds_base
      map: [ "enum.CMItemSlotsLayers.Fill" ]
    - state: rifle_ammo_full_rounds_color
      map: [ "enum.CMItemSlotsLayers2.Fill" ]
      color: "#719380"
    - state: rifle_lid
      map: [ "lid" ]
      color: "#62757b"
    - state: rifle_lid_marking
      map: [ "lid_marking" ]
      color: "#7c4c1b"
  - type: GenericVisualizer
    visuals:
      enum.DeployableItemVisuals.Deployed:
        lid:
          True: { visible: false }
          False: { visible: true }
        lid_marking:
          True: { visible: false }
          False: { visible: true }
      enum.CMItemSlotsLayers.Fill:
        enum.CMItemSlotsLayers.Fill:
          Empty: { state: rifle_ammo_full_rounds_base, visible: false }
          Low: { state: rifle_ammo_low_rounds_base, visible: true }
          Medium: { state: rifle_ammo_medium_rounds_base, visible: true }
          High: { state: rifle_ammo_high_rounds_base, visible: true }
          Full: { state: rifle_ammo_full_rounds_base, visible: true }
        enum.CMItemSlotsLayers2.Fill:
          Empty: { state: rifle_ammo_full_rounds_color, visible: false }
          Low: { state: rifle_ammo_low_rounds_color, visible: true }
          Medium: { state: rifle_ammo_medium_rounds_color, visible: true }
          High: { state: rifle_ammo_high_rounds_color, visible: true }
          Full: { state: rifle_ammo_full_rounds_color, visible: true }
  - type: CMItemSlots
    count: 34
    slot:
      whitelist:
        tags:
        - RMCCartridge4570
  - type: Clothing
    quickEquip: false
    slots:
    - Back


