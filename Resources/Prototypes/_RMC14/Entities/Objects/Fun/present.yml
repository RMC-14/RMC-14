- type: entity
  parent: RMCKitBase
  id: RMCFoamCrossbowCase
  name: crossbow kit
  description: Contains the equipment needed for having fun with a crossbow.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Storage/procase_mini.rsi
    layers:
    - state: closed
      map: [ base ]
    - state: pursuit
      map: [ label ]
  - type: Item
    size: Ginormous
  - type: Storage
    maxItemSize: Ginormous
    grid:
    - 0,0,5,1
  - type: RemoveOnlyStorage
  - type: FixedItemSizeStorage
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: StorageFill
    contents:
    - id: FoamCrossbow
      amount: 2
    - id: BoxDonkSoftBox

- type: entity
  parent: BaseItem
  id: RMCFoodPackageWSToken
  name: Weapons Specialist's token
  suffix: Food
  description: A rare, gleaming token awarded by UNMC High Command to only the most elite of the elite. It feels surprisingly light in your hand.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/coins.rsi
    state: coin_gold
  - type: Item
    sprite: _RMC14/Objects/Misc/coins.rsi
    size: Tiny
  - type: SpawnItemsOnUse
    items:
    - id: RMCFoodWSToken
      amount: 1
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: entity
  parent: CMMREFoodChocolateBrownie
  id: RMCFoodWSToken
  name: Weapons Specialist's chocolate token
  description: A milk chocolate token made with only the finest ingredients. What, did you expect an actual token?
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/coins.rsi
    state: coin_copper