- type: entity
  parent: BaseItem
  id: RMCReagentScanner
  name: reagent scanner
  description: A hand-held reagent scanner which identifies chemical agents.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/reagent_scanner.rsi
    state: spectrometer
  - type: Item
    size: Small
    sprite: _RMC14/Objects/Devices/reagent_scanner.rsi
  - type: RMCReagentScanner
  - type: Tag
    tags:
    - RMCReagentScanner
  - type: PhysicalComposition
