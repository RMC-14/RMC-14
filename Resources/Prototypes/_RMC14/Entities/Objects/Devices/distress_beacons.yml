# RMCERTDistressBeacon field guide:
# - allowedCalls: explicit ERT call prototypes this beacon may request; empty means all enabled handheld calls.
# - autoResolution: omit for admin approval; delay: 0s resolves immediately, positive delay allows admin review first.
# - autoResolution.approvalChance: 0..1, default 1; 1 guarantees approval, intermediate values roll for a response.
# - A single eligible call is selected directly; larger automatic pools use the calls' randomWeight values.
# - recipient: fallback name of the authority or organization receiving the request.
# - reasonRequired: whether the user must enter a non-empty reason.
# - singleUse: whether the beacon becomes spent after a successful request.
# - resetOnDeny: whether denial clears the spent/cooldown state for reuse.
# - cooldown: time before another request can be sent by this beacon.
# - lastUsed: runtime round time when the beacon last sent a request.
# - spent: runtime single-use state; normally not set in prototypes.
# - reasonLimit: maximum number of characters accepted for the request reason.

- type: entity
  parent: BaseItem
  id: RMCHandheldDistressBeaconBase
  name: handheld distress beacon
  description: A compact encrypted transmitter used to request an emergency response team.
  abstract: true
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/handheld_distress_beacon.rsi
    layers:
    - state: beacon_inactive
      map: [ "base" ]
  - type: Item
    size: Small
    sprite: _RMC14/Objects/Devices/handheld_distress_beacon.rsi
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.RMCERTDistressBeaconVisuals.Active:
        base:
          "True": { state: beacon_active }
          "False": { state: beacon_inactive }
  - type: UserInterface
    interfaces:
      enum.DialogUiKey.Key:
        type: DialogBui
  - type: RMCERTDistressBeacon

- type: entity
  parent: RMCHandheldDistressBeaconBase
  id: RMCHandheldDistressBeaconCMB
  name: CMB distress beacon
  suffix: CMB
  components:
  - type: RMCERTDistressBeacon
    recipient: Anchorpoint Station
    allowedCalls:
    - RMCERTCallCMB
    - RMCERTCallCMBRiot

- type: entity
  parent: RMCHandheldDistressBeaconCMB
  id: RMCHandheldDistressBeaconCMBMarshal
  name: CMB marshal distress beacon
  description: An encrypted marshal transmitter that automatically authorizes a Bureau reinforcement request.
  suffix: CMB, Automatic
  components:
  - type: RMCERTDistressBeacon
    autoResolution:
      delay: 0s
      approvalChance: 1

