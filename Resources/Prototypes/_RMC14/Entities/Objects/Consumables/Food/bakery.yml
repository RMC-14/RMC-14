#Contents of cakes.rsi

- type: entity
  parent: FoodInjectableBase
  id: RMCFoodCakeBase
  abstract: true
  components:
  - type: FlavorProfile
    flavors:
    - sweet
  - type: Food
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Food/cakes.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 55 # flavored cakes have less room for spiking
        reagents:
        - ReagentId: Nutriment
          Quantity: 40
        - ReagentId: Vitamin
          Quantity: 10
  - type: Item
    size: Normal
  - type: Tag
    tags:
    - Cake
  - type: SecretStash
    maxItemSize: "Normal"
    secretStashName: secret-stash-cake
    damageEatenItemInside:
      types:
        Slash: 7.5
  - type: ToolOpenable
    openToolQualityNeeded: Slicing
    closeToolQualityNeeded: Slicing
    verbOnly: true
  - type: ContainerContainer
    containers:
      stash: !type:ContainerSlot {}

- type: entity
  parent: RMCFoodCakeBase
  id: RMCFoodCakeSliceBase
  abstract: true
  description: Just a slice of cake, it is enough for everyone.
  components:
  - type: FlavorProfile
    flavors:
    - sweet
  - type: Food
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 12
        reagents:
        - ReagentId: Nutriment
          Quantity: 8
        - ReagentId: Vitamin
          Quantity: 2
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - Cake
    - Slice

- type: entity
  name: carrot cake
  parent: RMCFoodCakeBase
  id: RMCFoodCakeCarrot
  description: A favorite desert of a certain wascally wabbit.
  components:
  - type: Sprite
    state: carrotcake
  - type: SliceableFood
    slice: RMCFoodCakeCarrotSlice
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: JuiceCarrot
          Quantity: 15
        - ReagentId: Sugar
          Quantity: 5
        - ReagentId: Vitamin
          Quantity: 5
  - type: Tag
    tags:
    - Cake
    - Vegetable
  - type: Item
    inhandVisuals:
      left:
      - state: plain-inhand-left
        color: "#f8e0af"
      - state: alpha-filling-inhand-left
        color: "#ffbd2f"
      right:
      - state: plain-inhand-right
        color: "#f8e0af"
      - state: alpha-filling-inhand-right
        color: "#ffbd2f"

- type: entity
  name: slice of carrot cake
  parent: RMCFoodCakeSliceBase
  id: RMCFoodCakeCarrotSlice
  description: Carrotty slice of carrot cake. Carrots are good for your eyes!
