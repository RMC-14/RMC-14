# Contents of bakery.rsi
- type: entity
  name: chawanmushi
  parent: CMFoodBase
  id: RMCFoodChawanmushi
  description: A legendary egg custard that makes friends out of enemies. Probably too hot for a cat to eat.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Food/bakery.rsi
    state: chawanmushi
  - type: FlavorProfile
    flavors:
    - creamy
    - bread
  - type: Food
    transferAmount: 5
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 8
        reagents:
        - ReagentId: Nutriment
          Quantity: 6

- type: entity
  name: cookie
  parent: FoodBakedBase
  id: RMCFoodBakedCookie
  description: COOKIE!!!
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Food/bakery.rsi
    state: COOKIE!!!

- type: entity
  name: plump helmet biscuit
  parent: FoodBakedBase
  id: RMCFoodBakedPHelmBiscuit
  description: This is a finely-prepared plump helmet biscuit. The ingredients are exceptionally minced plump helmet, and well-minced dwarven wheat flour.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Food/bakery.rsi
    state: phelmbiscuit

- type: entity
  name: muffin
  parent: FoodInjectableBase
  id: RMCFoodBakedMuffin
  description: A little muffin. Spongy, moist, and delicious.
  components:
  - type: Food
    trash:
    - FoodPlateMuffinTin
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Food/bakery.rsi
    state: muffin
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Nutriment
          Quantity: 6
        - ReagentId: Vitamin
          Quantity: 2
  - type: FlavorProfile
    flavors:
    - sweet
  - type: Item
    size: Tiny

- type: entity
  name: golden apple streusel tart
  parent: FoodPieBase
  id: RMCFoodTartGapple
  description: A tasty dessert that won't make it through a metal detector.
  components:
  - type: FlavorProfile
    flavors:
    - apple
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Food/bakery.rsi
    state: gappletart
  - type: Tag
    tags:
    - Fruit
    - Pie

- type: entity
  name: pancakes
  parent: CMFoodBase
  id: RMCFoodPancakes
  description: Golden brown creamy pancakes fresh from the griddle. Drizzled with maple syrup and topped with a slice of butter.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Food/bakery.rsi
    state: pancakes
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Nutriment
          Quantity: 8

- type: entity
  parent: FoodDonkpocket
  id: RMCFoodDonkpocket
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Food/bakery.rsi
    state: donkpocket
  - type: Item
    size: Small

# Pies

- type: entity
  name: apple pie
  parent: FoodPieBase
  id: RMCFoodPieApple
  description: A pie containing sweet, sweet love... or apple.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Food/bakery.rsi
    state: applepie
  - type: FlavorProfile
    flavors:
    - sweet
    - apple
  - type: SliceableFood
    slice: FoodPieAppleSlice
  - type: Tag
    tags:
    - Fruit
    - Pie

- type: entity
  name: cherry pie
  parent: FoodPieBase
  id: RMCFoodPieCherry
  description: Taste so good, make a grown man cry.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Food/bakery.rsi
    state: cherrypie
  - type: FlavorProfile
    flavors:
    - sweet
    - cherry
  - type: SliceableFood
    slice: FoodPieAppleSlice
  - type: Tag
    tags:
    - Fruit
    - Pie

- type: entity
  name: meat pie
  parent: FoodPieBase
  id: RMCFoodPieMeat
  description: An old barber recipe, very delicious!
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Food/bakery.rsi
    state: meatpie
  - type: FlavorProfile
    flavors:
    - meaty
  - type: SliceableFood
    slice: FoodPieAppleSlice
  - type: Tag
    tags:
    - Meat
    - Pie

- type: entity
  name: xeno-pie
  parent: FoodPieBase
  id: RMCFoodPieXeno
  description: A delicious meatpie. Probably heretical.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Food/bakery.rsi
    state: xenomeatpie
  - type: FlavorProfile
    flavors:
    - meaty
    - acid
  - type: SliceableFood
    slice: FoodPieAppleSlice
  - type: Tag
    tags:
    - Meat
    - Pie

- type: entity
  name: banana cream pie
  parent: FoodPieBase
  id: RMCFoodPieBananaCream
  description: Just like back home, on clown planet! HONK!
  components:
  - type: FlavorProfile
    flavors:
    - sweet
    - banana
    - creamy
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Food/bakery.rsi
    state: pie
  - type: CreamPie
  - type: ThrowingAngle
    angle: 180
  - type: LandAtCursor
  - type: ContainerContainer
    containers:
      payloadSlot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      payloadSlot:
        whitelist:
          components:
          - OnUseTimerTrigger
        insertSound:
          path: /Audio/Weapons/Guns/Empty/empty.ogg
        ejectSound:
          path: /Audio/Weapons/Guns/Empty/empty.ogg
        swap: false
        disableEject: true
  - type: Tag
    tags:
    - Fruit
    - Pie
  - type: SliceableFood
    slice: FoodPieBananaCreamSlice


