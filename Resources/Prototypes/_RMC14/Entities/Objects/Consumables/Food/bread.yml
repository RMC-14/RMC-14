# Contents of bread.rsi
- type: entity
  parent: FoodInjectableBase
  id: RMCFoodBreadBase
  abstract: true
  components:
  - type: FlavorProfile
    flavors:
    - bread
  - type: Food
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Food/bread.rsi
  - type: Tag
    tags:
    - Bread
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 26
        reagents:
        - ReagentId: Nutriment
          Quantity: 20

- type: entity
  parent: RMCFoodBreadBase
  id: RMCFoodBreadSliceBase
  abstract: true
  components:
  - type: Item
    size: Tiny
  - type: FlavorProfile
    flavors:
    - bread
  - type: Tag
    tags:
    - Bread
    - Slice
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 8
        reagents:
        - ReagentId: Nutriment
          Quantity: 4

