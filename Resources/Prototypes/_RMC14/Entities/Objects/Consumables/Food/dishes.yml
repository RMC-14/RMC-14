# Contents of dishes.rsi

- type: entity
  name: berry clafoutis
  parent: FoodPieBase
  id: RMCFoodPieClafoutis
  description: No black birds, this is a good sign.
  components:
  - type: FlavorProfile
    flavors:
    - sweet
    - berry
  - type: Sprite
    sprite: _RMC14/Objects/Consumable/Food/dishes.rsi
    state: berryclafoutis
  - type: SliceableFood
    slice: RMCFoodPieClafoutisSlice
  - type: Tag
    tags:
    - Fruit
    - Pie

- type: entity
  name: slice of berry clafoutis
  parent: FoodPieSliceBase
  id: RMCFoodPieClafoutisSlice
  components:
