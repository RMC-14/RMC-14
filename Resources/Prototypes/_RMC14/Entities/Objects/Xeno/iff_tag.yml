- type: entity
  parent: BaseItem
  id: RMCXenoIffTag
  name: xenonid IFF tag
  description: A tag containing a small IFF computer that gets inserted into the carapace of a xenonid. It automatically protects whoever implants it.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Xeno/IFFTag.rsi
    state: xeno_tag
  - type: Item
    size: Tiny
    sprite: _RMC14/Objects/Xeno/IFFTag.rsi
  - type: RMCXenoIffTagItem

- type: entity
  parent: BaseStorageItem
  id: RMCXenoIffTagCase
  name: xenonid tag case
  description: A sturdy case designed to store and charge xenonid IFF tags.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Xeno/IFFTag.rsi
    state: tag_box
  - type: Item
    size: Normal
    sprite: _RMC14/Objects/Xeno/IFFTag.rsi
  - type: Storage
    grid:
    - 0,0,7,1
    whitelist:
      components:
      - RMCXenoIffTagItem
      - Multitool

- type: entity
  parent: RMCXenoIffTagCase
  id: RMCXenoIffTagCaseFull
  suffix: Full
  components:
  - type: StorageFill
    contents:
    - id: RMCXenoIffTag
    - id: RMCXenoIffTag
    - id: RMCXenoIffTag
    - id: RMCXenoIffTag
    - id: RMCXenoIffTag
    - id: RMCXenoIffTag
    - id: RMCXenoIffTag
    - id: RMCXenoIffTag
