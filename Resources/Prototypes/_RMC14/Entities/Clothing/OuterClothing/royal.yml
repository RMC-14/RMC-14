# External Webbing

- type: entity
  parent: RMCOuterClothingExternalWebbing
  id: RMCOuterClothingExternalWebbingRoyal
  name: MOLS suspenders
  description: A set of L1 pattern MOLS webbing, modified to act as external webbing in place of armor. This particular setup features suspenders, several pouches, and a set of clips capable of storing a weapon.
  suffix: Royal, External Webbing
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/Misc/mols_webbing.rsi

# Paramarines

- type: entity
  parent: [RMCJacketWindbreaker, RMCAllowSuitStorageClothingJacketMB]
  id: RMCJacketParaCombatJacket
  name: paramarine combat jacket
  suffix: RCM Para
  description: A rugged, all-weather combat jacket issued to the RCM's Paramarine regiments. Designed for versatility, it serves as both a field garment and a lightweight layer of protection. Reinforced with ballistic fibers and treated for weather resistance, it offers limited defense against shrapnel and small arms fire while keeping Paramarines comfortable in harsh conditions. Its deep green color and durable fabric make it a staple for both active deployment and off-duty wear.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/TSE/para.rsi
    layers:
    - state: icon
      map: [ "unfoldedLayer" ]
      visible: true
    - state: jacket-icon
      map: ["foldedLayer"]
      visible: false
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/OuterClothing/TSE/para.rsi
  - type: CMArmor
    melee: 15
    bullet: 15
    bio: 10
    explosionArmor: 10
    
- type: entity 
  parent: [RMCAllowSuitStorageClothingJacketMB, RMCBaseJacket]
  id: RMCJacketParaCOJacket
  name: paramarine commanding officer’s service jacket
  description: A service jacket typically worn by Commanding Officers of the RCM's Paramarine regiments. Reinforced with lightweight Kevlar shards, it offers limited protection against stabbing weapons and small arms fire while maintaining a formal yet practical design for leadership in the field.
  suffix: RCM Para
  components:
    - type: Sprite
      sprite: _RMC14/Objects/Clothing/OuterClothing/TSE/para_co.rsi
    - type: Clothing
      sprite: _RMC14/Objects/Clothing/OuterClothing/TSE/para_co.rsi
    - type: CMArmor
      melee: 10
      bullet: 10
      
- type: entity
  parent: RMCJacketParaCOJacket
  id: RMCJacketParaCOJacketAlt
  name: paramarine commanding officer’s service jacket
  description: A service jacket typically worn by Commanding Officers of the RCM's Paramarine regiments. Reinforced with lightweight Kevlar shards, it offers limited protection against stabbing weapons and small arms fire while maintaining a formal yet practical design for leadership in the field.
  suffix: RCM Para
  components:
    - type: Sprite
      sprite: _RMC14/Objects/Clothing/OuterClothing/TSE/para_co_alt.rsi
    - type: Clothing
      sprite: _RMC14/Objects/Clothing/OuterClothing/TSE/para_co_alt.rsi

- type: entity
  parent: RMCArmorRoyal
  id: RMCArmorParaVest
  name: goshawk airborne vest
  description: A lightweight, high-mobility flak vest designed for the RCM's Paramarines. Developed by Weston-Yamada, the Goshawk offers crucial protection while ensuring paratroopers retain full freedom of movement during high-risk insertions. Advanced composite plating and reinforced webbing make it effective against shrapnel and small-arms fire, striking the perfect balance between defense and agility for those who strike fast and strike hard.
  suffix: RCM Para
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/Royal/para_vest.rsi
  - type: CMArmor
    melee: 15
    bullet: 20 # CLOTHING_ARMOR_MEDIUMHIGH
    explosionArmor: 15 # CLOTHING_ARMOR_MEDIUM
  - type: RMCArmorSpeedTier
    speedTier: light
  - type: ClothingSpeedModifier # SLOWDOWN_ARMOR_SUPER_LIGHT
    walkModifier: 0.949
    sprintModifier: 0.949
  - type: Storage
    grid:
    - 0,0,5,1 # 3 slots

- type: entity
  parent: RMCArmorParaVest
  id: RMCArmorParaSynthVest
  name: goshawk airborne synthetic vest
  description: A lightweight, high-mobility flak vest designed for synthetic units attached to the RCM's Paramarine regiments. Developed by Weston-Yamada, the Goshawk offers crucial protection while ensuring paratroopers retain full freedom of movement during high-risk insertions. Advanced composite plating and reinforced webbing make it effective against shrapnel and small-arms fire, striking the perfect balance between defense and agility for those who strike fast and strike hard.
  suffix: RCM Para
  components:
    - type: CMArmor
      melee: 0 # CLOTHING_ARMOR_NONE
      bullet: 0 # CLOTHING_ARMOR_NONE
      bio: 0 # CLOTHING_ARMOR_NONE
      explosionArmor: 0 # CLOTHING_ARMOR_NONE
    - type: Storage
      grid:
        - 0,0,7,1 # 4 slots
    - type: Tag
      tags:
        - RMCSynthAllowedArmor
