# SPP armors
- type: entity
  parent: CMArmorM3Medium
  id: RMCArmorSPP
  name: UM5 personal armor
  description: Standard body armor of the SPP military, the UM5 (Union Medium MK5) is a medium body armor, roughly on par with the M3 pattern body armor in service with the UNMC, specialized towards ballistics protection. Unlike the M3, however, the plate has a heavier neckplate. This has earned many UN members to refer to SPP soldiers as 'tin men'.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/SPP/spp.rsi
  - type: CMArmor
    bullet: 30 # CLOTHING_ARMOR_HIGH
    bio: 15 # CLOTHING_ARMOR_MEDIUMLOW
    explosionArmor: 20 # CLOTHING_ARMOR_MEDIUM
  - type: RMCArmorSpeedTier
    speedTier: medium
  - type: ClothingSpeedModifier # SLOWDOWN_ARMOR_MEDIUM
    walkModifier: 0.666
    sprintModifier: 0.666
  - type: Storage
    grid:
    - 0,0,1,1 # 1 slot
  - type: ItemCamouflage
    camouflageVariations: { }

- type: entity
  parent: RMCArmorSPP
  id: RMCArmorSPPRifleman
  suffix: Filled, Rifleman
  components:
  - type: StorageFill
    contents:
    - id: RMCBinoculars

- type: entity
  parent: RMCArmorSPP
  id: RMCArmorSPPSpetsnazAlt
  name: Izdeliye-M T5 tactical vest
  description: An early production model of the CCC5-L Tactical Vest designed for Spetsnaz forces. While more protective than its' newer cousin, the lack of extra pouches and use of heavier composites adds a lot of extra bulk which hinders movement. Despite being a somewhat outdated design, it's still issued to some Spetsnaz units.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/SPP/spetsnaz_vest.rsi

- type: entity
  parent: RMCArmorSPP
  id: RMCArmorSPPSupport
  name: UL6 personal armor
  description: Standard body armor of the SPP military, the UL6 (Union Light MK6) is a light body armor, slightly weaker than the M3 pattern body armor in service with the UNMC, specialized towards ballistics protection. This set of personal armor lacks the iconic neck piece and some of the armor in favor of user mobility.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/SPP/support.rsi
  - type: CMArmor
    melee: 30 # CLOTHING_ARMOR_HIGH
  - type: RMCArmorSpeedTier
    speedTier: light
  - type: ClothingSpeedModifier # SLOWDOWN_ARMOR_LIGHT
    walkModifier: 0.725
    sprintModifier: 0.725
  - type: Storage
    grid:
    - 0,0,5,1 # 3 slots

- type: entity
  parent: RMCArmorSPPSupport
  id: RMCArmorSPPSpetsnazSupport
  name: Izdeliye-S T5 tactical support vest
  description: The final iteration of the CCC5-L Tactical Plated Vest before it recieved its' official designation, designed for Spetsnaz forces. Offering a middle ground between the 'H' and 'M' T5 models, the 'S' vest features enhanced mobility with an improved armor package, though critically lacks limb coveraeg. Despite being a somewhat outdated design, it's still in use by some Spetsnaz units who prefer the wider range of movement the lower armor coverage affords them.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/SPP/spetsnaz_plated.rsi

- type: entity
  parent: RMCArmorSPPSupport
  id: RMCArmorSPPSupportSynth
  name: SPP UL6 synthetic personal armor
  description: Modified variant of the UL6 personal armor system intended to be usable by Synthetic units. Offers no protection but very little movement impairment.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/SPP/support.rsi
  - type: Clothing
    equipDelay: 1
    unequipDelay: 0.5
  - type: CMArmor
    melee: 0 # CLOTHING_ARMOR_NONE
    bullet: 0
    bio: 0
    explosionArmor: 0
  - type: RMCArmorSpeedTier
    speedTier: very light
  - type: ClothingSpeedModifier # SLOWDOWN_ARMOR_VERY_LIGHT
    walkModifier: 0.897
    sprintModifier: 0.897
  - type: Tag
    tags:
    - RMCSynthAllowedArmor

- type: entity
  parent: RMCArmorSPPSupportSynth
  id: RMCArmorSPPSupportSynthFilled
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    #- id: RMCTelebaton // TODO RMC14 should be telebaton
    - id: RMCHandcuffs
    - id: RMCHandcuffs

- type: entity
  parent: RMCArmorSPP
  id: RMCArmorSPPCommando
  name: SPP UM5CU personal armor
  description: A modification of the UM5, designed for stealth operations.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/SPP/commando.rsi
  - type: RMCArmorSpeedTier
    speedTier: light
  - type: ClothingSpeedModifier # SLOWDOWN_ARMOR_LIGHT
    walkModifier: 0.725
    sprintModifier: 0.725
  - type: Tag
    tags:
      - RMCScoutArmor
  - type: Storage
    grid:
    - 0,0,3,1 # 2 slots

- type: entity
  parent: RMCArmorSPP
  id: RMCArmorSPPHeavy
  name: UH7 heavy plated armor
  description: An extremely heavy-duty set of body armor in service with the SPP military, the UH7 (Union Heavy MK7) is known for having powerful ballistic protection, alongside a noticeable neck guard, fortified in order to allow the wearer to endure the stresses of the bulky helmet.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/SPP/heavy.rsi
  - type: RMCArmorSpeedTier
    speedTier: heavy
  - type: ClothingSpeedModifier # SLOWDOWN_ARMOR_HEAVY
    walkModifier: 0.62
    sprintModifier: 0.62
  - type: CMArmor
    melee: 25 # CLOTHING_ARMOR_MEDIUMHIGH (melee)
    bullet: 35 # CLOTHING_ARMOR_HIGHPLUS (bullets)
    bio: 20 # CLOTHING_ARMOR_MEDIUM
    explosionArmor: 30 # CLOTHING_ARMOR_HIGH
  - type: Storage
    grid:
    - 0,0,5,1 # 3 slots
  - type: IgnoreContentsSize # TODO RMC14: Also ignores minigun mags size
    items:
      tags:
      - RMCMagazineLMGQYJ72
  - type: RMCGrantLeapProtection

- type: entity
  parent: RMCArmorSPPHeavy
  id: RMCArmorSPPSpetsnazHeavyAlt
  name: Izdeliye-H T5 heavy tactical vest
  description: An early production model of the CCC5-L Heavy Tactical Vest designed for Spetsnaz forces. The 'H' variant features further reinforced armor and add-on modular pouches. Despite the superiority of the newer CC5-L HTV, some Spetsnaz specialists prefer to use the older version due to its' unique ability to mount a fortified add-on neck plate.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/SPP/spetsnaz_heavy.rsi

- type: entity
  parent: RMCArmorSPPHeavy
  id: RMCArmorSPPHeavySpecialist
  suffix: Filled, Specialist, QYJ72
  components:
  - type: IgnoreContentsSize
    items:
      tags:
      - RMCMagazineLMGQYJ72
  - type: StorageFill
    contents:
    - id: RMCMagazineLMGQYJ72
      amount: 3

- type: entity
  parent: CMArmorM3Medium
  id: RMCArmorSPPArmy
  name: 6B80 personal body armor
  description: An older SPP personal armor system that's since been replaced by the SPP Army Standard 6B90 body armor. It is still used by certain SPP Army units that the SPP doesn't expect to see much combat.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/SPP/army.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/OuterClothing/SPP/army.rsi
  - type: RMCArmorSpeedTier
    speedTier: light
  - type: ClothingSpeedModifier # SLOWDOWN_ARMOR_LIGHT
    walkModifier: 0.725
    sprintModifier: 0.725
  - type: CMArmor
    melee: 15 # CLOTHING_ARMOR_MEDIUMLOW
    bullet: 15 # CLOTHING_ARMOR_MEDIUM
    #energy: 15 # CLOTHING_ARMOR_MEDIUMLOW
    #rad: 20 # CLOTHING_ARMOR_MEDIUM
    explosionArmor: 15 # CLOTHING_ARMOR_MEDIUMLOW
    #internal: 20 # CLOTHING_ARMOR_MEDIUM
  - type: ItemCamouflage
    camouflageVariations: { }

- type: entity
  parent: RMCArmorSPP
  id: RMCArmorSPPSpetsnaz
  name: SPP CCC5-L tactical vest
  description: A lightweight SPP-issued armor vest designed for Spetsnaz forces. It features polymer-ceramic composite plating for improved protection while allowing greater mobility. Equipped with modular pouches for ammunition and gear, it ensures rapid access to essential supplies.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/SPP/spetsnaz_vest.rsi
  - type: CMArmor # Covers arms
    melee: 15
    bullet: 20
    bio: 20
    explosionArmor: 10
  - type: CMHardArmor
  - type: RMCArmorSpeedTier
    speedTier: light
  - type: ClothingSpeedModifier # SLOWDOWN_ARMOR_LIGHT
    walkModifier: 0.725
    sprintModifier: 0.725
  - type: Storage
    grid:
    - 0,0,7,1 # 4 slots

- type: entity
  parent: RMCArmorSPPSpetsnaz
  id: RMCArmorSPPSpetsnazFilled
  suffix: Filled, Survivor
  components:
