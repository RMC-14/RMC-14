- type: entity
  parent: RMCCoatOfficerShortWhite
  id: RMCCoatOfficerLongWhite
  name:  SPP UL5-W Shinel
  description: A longer variant of the Naval UL5-W jacket found mainly during ceremonial functions and the winter months. Primarily used by COs.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/SPP/kommisarwhiteshinel.rsi
  - type: Clothing
