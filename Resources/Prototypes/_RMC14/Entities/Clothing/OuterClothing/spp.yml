    - id: RMCTacticalPrybar
    - id: RMCMagazineRifleType77
    - id: RMCMagazineRifleType77
    - id: RMCRadioHandheldColony

- type: entity
  parent: RMCArmorSPP
  id: RMCArmorSPPSpetsnazHeavy
  name: SPP CCC5-L heavy tactical vest
  description: A heavily reinforced SPP-issued tactical vest designed for Spetsnaz forces operating in high-risk environments. The CCC5-L Heavy-Plated Tactical Vest features additional polymer-ceramic composite plating across the chest and torso, providing superior protection against ballistic and explosive threats. Despite its bulk, the vest maintains a balance between protection and mobility, with modular pouches for quick access to essential gear.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/SPP/spetsnaz_heavy.rsi
  - type: CMArmor # Covers arms and groin
    melee: 20
    bullet: 25
    bio: 20
    explosionArmor: 15
  - type: CMHardArmor
  - type: RMCArmorSpeedTier
    speedTier: light
  - type: ClothingSpeedModifier # SLOWDOWN_ARMOR_LIGHT
    walkModifier: 0.725
    sprintModifier: 0.725
  - type: Storage
    grid:
    - 0,0,7,1 # 4 slots

