- type: entity
  parent: [RMCJumpsuitTSEPA, RMCFoldableUniformBase]
  id: RMCJumpsuitMarineParaService
  name: paramarine service uniform
  description: A formal No.2 service uniform worn by officers of the RCM's Paramarine regiments. Features the same upper torso cut as the No.8 BDU, but paired with pressed khaki trousers. Issued for inspections, ceremonial duties, or when deployed in an advisory role.
