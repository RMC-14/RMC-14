- type: entity
  id: RMCBiomassUpgradeAutodocLarvaExtraction
  name: AutoDoc Embryo Removal
  description: Data and instruction set for AutoDoc making it mildly proficient in removing parasites left by unknown organism.
  categories: [ HideSpawnMenu ]
  components:
  - type: RMCBiomassUpgrade
    category: Machinery
    cost: 4000
    requiredClearance: 6
    printedItem: RMCResearchUpgradeAutodocLarvaExtraction

- type: entity
  id: RMCBiomassUpgradeSleeper
  name: Sleeper Upgrade
  description: Research upgrade for Sleeper system, technology on this disk is used on a sleeper to allow wider spectrum of chemicals to be administered, as well as upgrading dialysis software.
  categories: [ HideSpawnMenu ]
  components:
  - type: RMCBiomassUpgrade
    category: Machinery
    cost: 500
    requiredClearance: 1
    printedItem: RMCResearchUpgradeSleeper

- type: entity
  id: RMCBiomassUpgradeAutoHarvest
  name: Auto-Harvest Botany Upgrade
  description: Research upgrade for hydroponics system, technology on this disk automatically shakes the plant once it is ready to be harvested.
  categories: [ HideSpawnMenu ]
  components:
  - type: RMCBiomassUpgrade
    category: Machinery
    cost: 250
    requiredClearance: 2
    printedItem: RMCAutoHarvestUpgrade

