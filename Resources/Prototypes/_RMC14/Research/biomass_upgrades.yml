# ---------------- Armor ----------------

- type: entity
  id: RMCBiomassUpgradeTranslatorPlate
  name: Universal Translator Plate
  description: A uniform-attachable plate capable of translating any unknown language heard by the wearer.
  categories: [ HideSpawnMenu ]
  components:
  - type: RMCBiomassUpgrade
    category: Armor
    cost: 2000
    requiredClearance: 6
    printedItem: RMCArmorPlateTranslator

- type: entity
  id: RMCBiomassUpgradeCoagulatorPlate
  name: Active Blood Coagulator Plate
  description: A uniform-attachable plate capable of coagulating any bleeding wounds the user possesses.
  categories: [ HideSpawnMenu ]
  components:
  - type: RMCBiomassUpgrade
    category: Armor
    cost: 1200
    requiredClearance: 2
    printedItem: RMCArmorPlateCoagulator
    priceChange: -200
    minimumPrice: 200

- type: entity
  id: RMCBiomassUpgradeEmergencyInjectorPlate
  name: Medical Emergency Injector
  description: A medical plate with two buttons on the sides and a hefty chemical tank. Attached to a uniform and on a simultaneous press, it injects an emergency dose of medical chemicals much larger than a normal emergency autoinjector. Single time use and is recycled in biomass printer. Features overdose protection.
  categories: [ HideSpawnMenu ]
  components:
  - type: RMCBiomassUpgrade
    category: Armor
    cost: 250
    requiredClearance: 1
    printedItem: RMCArmorPlateEmergencyInjector
    priceChange: -100
    minimumPrice: 100

- type: entity
  id: RMCBiomassUpgradeCeramicPlate
  name: Ceramic Armor Plate
  description: A strong trauma plate, able to protect the user from a large amount of bullets. Completely useless against sharp objects.
  categories: [ HideSpawnMenu ]
  components:
  - type: RMCBiomassUpgrade
    category: Armor
    cost: 500
    requiredClearance: 2
    printedItem: RMCArmorPlateCeramic
    priceChange: -100
    minimumPrice: 200

- type: entity
  id: RMCBiomassUpgradeAntiDecayPlate
  name: Death Preservation Plate
  description: Preservation plate which activates once the user is dead, uses variety of different substances and sensors to slow down the decay and increase the time before the user is permanently dead, due to small tank of preservatives, it needs to be replaced on each death. Extends time to permadeath by around four minutes.
  categories: [ HideSpawnMenu ]
  components:
  - type: RMCBiomassUpgrade
    category: Armor
    cost: 500
    requiredClearance: 4
    printedItem: RMCArmorPlateAntiDecay
    priceChange: -100
    minimumPrice: 100
