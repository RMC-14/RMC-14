    inherentStunDuration: 1.5
    fullProtection: true
  - type: MobThresholds
    thresholds:
      0: Alive
      400: Dead
  - type: MovementSpeedModifier
    baseSprintSpeed: 3.625
    baseWalkSpeed: 1.9575
  - type: ShowHealthIcons
  - type: ShowHealthBars
  - type: RemoveComponents
    components:
    - type: HiddenAppearance

