    generation: RMCSynthGenOne
    damageModifier: RMCSynthGenOne
    priority: 1
    description: Slow and sturdy. Pounce resisting.
  - type: Skills
    skills:
      RMCSkillCqc: 3
      RMCSkillEngineer: 4
      RMCSkillConstruction: 3
      RMCSkillFirearms: 2
      RMCSkillOverwatch: 1
      RMCSkillMedical: 3
      RMCSkillSurgery: 2
      RMCSkillResearch: 1
      RMCSkillMeleeWeapons: 2
      RMCSkillPilot: 2
