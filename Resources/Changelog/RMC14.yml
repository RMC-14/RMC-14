- author: Vixting
  changes:
  - message: Adds languages. Languages can be selected from the traits section. If
      you don't understand the language, the words spoken will be garbled for you.
      Normal languages use a round seed, meaning you can learn what a word means in
      a round even if you don't know the language. Xenonid language is completely
      random however.
    type: Add
  - message: Adds language learning system, currently only for synths to learn xenonid,
      through exposure to the language you will learn it. Survivor synths have a boosted
      initial learning rate.
    type: Add
  - message: Radios now support different prefixes.
    type: Add
  - message: . now supports multi broadcast
    type: Tweak
